<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>On Tour — Cenco Malls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/cencobricks-tokens.css" />
  <link rel="stylesheet" href="../shared/cencobricks-shell.css" />
  <link rel="stylesheet" href="../shared/app.css" />
  <script src="../shared/qrcode.min.js"></script>
  <script src="../shared/locale.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="../shared/lock-viewport.js"></script>
  <style>
    html, body {
      background: transparent;
      color: var(--cm-text);
      font-family: var(--cb-font-body);
    }
    body::before { display: none; }

    .app-shell {
      background: transparent;
      gap: 0;
      padding: 0 0 28px;
    }

    .card.cm-body-panel {
      margin: 0 14px 14px;
      padding: 14px;
      gap: 14px;
      background: var(--cb-white);
      border: 1px solid var(--cm-line);
      border-top: 0;
      border-radius: 0 0 var(--cb-topbar-decoration-radius) var(--cb-topbar-decoration-radius);
      box-shadow: none;
    }

    .bullet-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
      line-height: 1.5;
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 18px 16px;
      border-radius: var(--cb-radius-m);
      background: #fff;
      border: 1px solid var(--cm-line);
      box-shadow: var(--cm-shadow);
    }

    .qr-box .qr-container img,
    .qr-box .qr-container canvas {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      background: #fff;
      object-fit: contain;
    }

    .qr-caption {
      margin: 0;
      width: 100%;
      max-width: none;
      padding: 0 4px;
      font-size: 18px;
      font-weight: 600;
      font-family: var(--cb-font-title);
      line-height: 1.45;
      color: var(--cm-text);
      text-align: left;
    }

    .btn-primary, .btn-secondary {
      border-radius: var(--cb-btn-radius);
      padding: var(--cb-btn-pad-y-s) var(--cb-btn-pad-x-m);
      font-family: var(--cb-btn-font);
      font-size: var(--cb-btn-font-m);
      font-weight: var(--cb-btn-weight);
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-primary {
      background: var(--cb-btn-primary-fill);
      color: var(--cb-btn-primary-text);
      border: none;
    }

    .btn-secondary {
      background: var(--cb-btn-secondary-fill);
      color: var(--cb-btn-secondary-text);
      border: 1px solid var(--cb-btn-secondary-stroke);
      width: auto;
      align-self: flex-start;
    }

    .title {
      font-family: var(--cb-font-title);
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--cm-text);
      margin: 0;
    }

    .subtitle {
      color: var(--cm-muted);
      font-size: 0.9375rem;
      line-height: 1.45;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="cm-header">
      <button
        class="cm-header-icon-btn"
        id="btnCloseHeader"
        type="button"
        onclick="closeWebview()"
        aria-label="Volver"
      >
        <svg class="cm-header-back-icon" width="24" height="24" viewBox="8 8 24 24" aria-hidden="true" focusable="false">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 20C12 19.4477 12.4477 19 13 19H27C27.5523 19 28 19.4477 28 20C28 20.5523 27.5523 21 27 21H13C12.4477 21 12 20.5523 12 20Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12.2929 19.2929C12.6834 18.9024 13.3166 18.9024 13.7071 19.2929L19.7071 25.2929C20.0976 25.6834 20.0976 26.3166 19.7071 26.7071C19.3166 27.0976 18.6834 27.0976 18.2929 26.7071L12.2929 20.7071C11.9024 20.3166 11.9024 19.6834 12.2929 19.2929Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M19.7071 13.2929C20.0976 13.6834 20.0976 14.3166 19.7071 14.7071L13.7071 20.7071C13.3166 21.0976 12.6834 21.0976 12.2929 20.7071C11.9024 20.3166 11.9024 19.6834 12.2929 19.2929L18.2929 13.2929C18.6834 12.9024 19.3166 12.9024 19.7071 13.2929Z"/>
        </svg>
      </button>
      <h1 class="cm-header-title">
        <span class="cm-header-mall" role="img" aria-label="Cenco Costanera">
          <svg class="cm-header-mall-pin" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 21s-6.5-5.5-6.5-11a6.5 6.5 0 1 1 13 0c0 5.5-6.5 11-6.5 11z"/>
            <circle cx="12" cy="10" r="2.25" stroke-width="1.75"/>
          </svg>
          <span class="cm-header-mall-name">Cenco Costanera</span>
        </span>
      </h1>
    </header>

    <div class="card cm-body-panel">
      <div class="cm-page-intro">
        <h2 id="page-title">On Tour</h2>
        <p id="page-subtitle">Tu pasaporte a una experiencia exclusiva en Cenco Costanera</p>
      </div>

      <div class="title" id="section-title">¿De visita en Santiago?</div>
      <div class="subtitle" id="section-lead">
        Programa exclusivo para turistas con descuentos, promociones y panoramas únicos.
      </div>

      <ul class="bullet-list" id="benefits-list"></ul>

      <div class="qr-box">
        <p class="qr-caption" id="qr-hint"></p>
        <div id="qr-container" class="qr-container"></div>
      </div>

      <button class="btn-secondary" id="btnClose" type="button" onclick="closeWebview()">Cerrar</button>
    </div>
  </div>

  <script>
    let ontourUrl = "https://www.cencomalls.cl/costanera/Ontour-es";
    let currentLocale = "es";

    const I18N = {
      es: {
        pageTitle: "On Tour",
        pageSubtitle: "Tu pasaporte a una experiencia exclusiva en Cenco Costanera",
        sectionTitle: "¿De visita en Santiago?",
        sectionLead: "Programa exclusivo para turistas con descuentos, promociones y panoramas únicos.",
        benefits: [],
        qrHint: "Escanea el código QR para activar tu tarjeta o para registrarte en el programa On Tour.",
        close: "Cerrar",
        speakIntro: "Escanea el código QR para activar tu tarjeta o para registrarte en el programa On Tour."
      },
      en: {
        pageTitle: "On Tour",
        pageSubtitle: "Your passport to an exclusive experience at Cenco Costanera",
        sectionTitle: "Visiting Santiago?",
        sectionLead: "Exclusive tourist program with discounts, promotions and unique experiences.",
        benefits: [],
        qrHint: "Scan the QR code to activate your card or register for the On Tour program.",
        close: "Close",
        speakIntro: "Scan the QR code to activate your card or register for the On Tour program."
      },
      pt: {
        pageTitle: "On Tour",
        pageSubtitle: "Seu passaporte para uma experiência exclusiva no Cenco Costanera",
        sectionTitle: "Visitando Santiago?",
        sectionLead: "Programa exclusivo para turistas com descontos, promoções e experiências únicas.",
        benefits: [],
        qrHint: "Escaneie o código QR para ativar seu cartão ou cadastrar-se no programa On Tour.",
        close: "Fechar",
        speakIntro: "Escaneie o código QR para ativar seu cartão ou cadastrar-se no programa On Tour."
      }
    };

    function closeWebview() {
      try {
        if (window.SimaBridge && typeof window.SimaBridge.requestClose === "function") {
          window.SimaBridge.requestClose();
          return;
        }
      } catch (e) {}
      try {
        if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === "function") {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: "close_webview",
            payload: {},
          }));
          return;
        }
      } catch (e2) {}
      try {
        if (window.SimaBridge && typeof window.SimaBridge.send === "function") {
          window.SimaBridge.send("close_webview", {});
        }
      } catch (e3) {}
    }

    function applyLocale() {
      currentLocale = SimaLocale.readLocaleFromPage();
      document.documentElement.lang = currentLocale;

      document.getElementById("page-title").textContent = SimaLocale.t(I18N, "pageTitle", currentLocale);
      document.getElementById("page-subtitle").textContent = SimaLocale.t(I18N, "pageSubtitle", currentLocale);
      document.getElementById("section-title").textContent = SimaLocale.t(I18N, "sectionTitle", currentLocale);
      document.getElementById("section-lead").textContent = SimaLocale.t(I18N, "sectionLead", currentLocale);
      document.getElementById("qr-hint").textContent = SimaLocale.t(I18N, "qrHint", currentLocale);
      document.getElementById("btnClose").textContent = SimaLocale.t(I18N, "close", currentLocale);
      const headerClose = document.getElementById("btnCloseHeader");
      if (headerClose) headerClose.setAttribute("aria-label", SimaLocale.t(I18N, "close", currentLocale));

      const pack = SimaLocale.pickPack(I18N, currentLocale);
      const benefits = pack.benefits || [];
      const listEl = document.getElementById("benefits-list");
      listEl.innerHTML = benefits.map((item) => `<li>${item}</li>`).join("");
      listEl.style.display = benefits.length ? "" : "none";
    }

    let introSpoken = false;

    function isLocalPreview() {
      var host = String(window.location.hostname || "").toLowerCase();
      return host === "localhost" || host === "127.0.0.1";
    }

    function speakPageIntro() {
      if (introSpoken) return;
      if (typeof SimaBridge === "undefined" || typeof SimaBridge.speak !== "function") return;
      introSpoken = true;
      SimaBridge.speak(SimaLocale.t(I18N, "speakIntro", currentLocale));
    }

    function renderQrImage(base64) {
      var box = document.getElementById("qr-container");
      if (!box) return;
      box.innerHTML = "";

      if (base64) {
        var img = document.createElement("img");
        img.id = "qr-image";
        img.alt = "QR On Tour";
        img.src = "data:image/png;base64," + base64;
        box.appendChild(img);
        SimaBridge.send("qr_displayed", { id: "ontour", url: ontourUrl });
        return;
      }

      if (isLocalPreview() && typeof QRCode !== "undefined" && ontourUrl) {
        new QRCode(box, {
          text: ontourUrl,
          width: 220,
          height: 220,
          colorDark: "#1a1a1a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M,
        });
      }
    }

    window.handleUnityData = function(data) {
      if (!data) return;
      if (typeof data === "string") {
        try { data = JSON.parse(data); } catch (e) { return; }
      }

      if (data.url) ontourUrl = data.url;
      applyLocale();
      renderQrImage(data.qrImage || "");
      speakPageIntro();
    };

    SimaLocale.bindPageLocale(applyLocale);

    window.addEventListener("load", () => {
      applyLocale();
      renderQrImage("");
      SimaBridge.ready("ontour");
      speakPageIntro();
    });
  </script>
</body>
</html>
