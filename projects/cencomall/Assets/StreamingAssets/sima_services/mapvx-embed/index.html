<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MapVX Embed (scaffold)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #fff; font-family: Arial, sans-serif; color: #202124; }
    .shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    .banner {
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      background: linear-gradient(180deg, #fafafa, #fff);
      font-size: 13px;
      line-height: 1.45;
    }
    .banner strong { display: block; margin-bottom: 4px; }
    .content { display: grid; grid-template-columns: 1.4fr 0.6fr; min-height: 0; }
    .map-frame-wrap { min-height: 0; overflow: hidden; }
    #mapvx-map-frame { width: 100%; height: 100%; border: 0; display: block; }
    .panel {
      border-left: 1px solid #e0e0e0;
      padding: 16px;
      background: #fcfcfc;
      overflow: auto;
    }
    .panel h2 { margin: 0 0 12px; font-size: 15px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; font-size: 13px; }
    .k { color: #5f6368; }
    .v { word-break: break-word; }
    pre { margin: 12px 0 0; white-space: pre-wrap; word-break: break-word; background: #f6f8fa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 12px; }
  </style>
  <!-- REPLACE: add official MapVX Web Component script here -->
  <!-- <script type="module" src="https://cdn.mapvx.com/....js"></script> -->
</head>
<body>
  <div class="shell">
    <div class="banner">
      <strong>MapVX embed scaffold</strong>
      This local-only harness confirms the iframe receives config from the parent without affecting the current MapVX flow.
    </div>
    <div class="content">
      <div class="map-frame-wrap">
        <iframe id="mapvx-map-frame" src="../map/index.html?embed=1" title="MapVX local map" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
      <aside class="panel">
        <h2>Received config</h2>
        <div class="kv" id="mapvx-config-view">
          <div class="k">Status</div><div class="v" id="mapvx-config-status">Waiting for MAPVX_CONFIG</div>
        </div>
        <pre id="mapvx-config-json">{}</pre>
      </aside>
    </div>
  </div>
  <script src="./bridge.js" type="module"></script>
  <script src="./register-sw.js" type="module"></script>
</body>
</html>
