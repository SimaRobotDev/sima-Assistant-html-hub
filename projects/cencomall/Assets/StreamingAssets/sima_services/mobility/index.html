<!-- Hide search UI on first paint when deep-linking straight into the map. -->
<script>
(function () {
  try {
    var params = new URLSearchParams(window.location.search || "");
    var auto = params.get("autoMap") === "1" || params.get("autoRoute") === "1";
    if (!auto) {
      try {
        var raw = "";
        try { raw = sessionStorage.getItem("sima_pending_service_route") || ""; } catch (eSessionRead) { /* noop */ }
        if (!raw) {
          try { raw = localStorage.getItem("sima_pending_service_route") || ""; } catch (eLocalRead) { /* noop */ }
        }
        if (raw) {
          var pending = JSON.parse(raw);
          var pendingExpired = pending && pending.expiresAt && Number(pending.expiresAt) < Date.now();
          if (pendingExpired) {
            sessionStorage.removeItem("sima_pending_service_route");
            localStorage.removeItem("sima_pending_service_route");
          } else {
            auto = !!(pending && (pending.autoMap || pending.autoRoute || pending.autoMap === "1"));
          }
        }
      } catch (ePending) { /* noop */ }
    }
    if (auto) document.documentElement.classList.add("auto-map-launch");

    // Voice/RN launch with a query: hide empty searcher on first paint.
    var bootQuery = String(
      window.MALL_SEARCH_QUERY
      || window.MALL_INITIAL_QUERY
      || window.MALL_VOICE_QUERY
      || params.get("q")
      || params.get("query")
      || params.get("search")
      || params.get("text")
      || ""
    ).trim();
    var bootService = String(
      window.MALL_SERVICE_ID
      || params.get("serviceId")
      || params.get("service")
      || ""
    ).trim();
    if (bootQuery || bootService) {
      document.documentElement.classList.add("search-boot-loading");
    }
  } catch (e) { /* noop */ }
})();
</script>
<script>
// Simple navigation stack to implement consistent "back" behavior.
// Views: 'landing', 'categories', 'categoryResults', 'az', 'storeDetail', 'map', 'searchResults'
window.mobilityNavStack = window.mobilityNavStack || ["landing"];
function pushMobilityView(view) {
  try {
    if (!view) return;
    const top = window.mobilityNavStack[window.mobilityNavStack.length - 1];
    if (top === view) return;
    window.mobilityNavStack.push(view);
  } catch (e) {}
}
function popMobilityView() {
  try {
    if (window.mobilityNavStack && window.mobilityNavStack.length > 1) {
      window.mobilityNavStack.pop();
      return window.mobilityNavStack[window.mobilityNavStack.length - 1];
    }
  } catch (e) {}
  return null;
}
function currentMobilityView() {
  try { return window.mobilityNavStack[window.mobilityNavStack.length - 1]; } catch (e) { return null; }
}
function resetToLanding() {
  window.mobilityNavStack = ["landing"];
}
</script>

function getMobilityMode() {
  const params = new URLSearchParams(window.location.search);
  return params.get("mode") || "";
}

function isLocalHtmlMode() {
  // file:// (totem / offline) OR browser preview on localhost.
  // Without this, http://127.0.0.1 hides the search landing unless ?mode=store_search.
  if (window.location.protocol === "file:") return true;
  try {
    const host = String(window.location.hostname || "").toLowerCase();
    return host === "localhost" || host === "127.0.0.1" || host === "[::1]";
  } catch (e) {
    return false;
  }
}

function normalizeTotemFloorValue(value) {
  if (typeof ServicesCatalog !== "undefined" && ServicesCatalog.normalizeFloorKey) {
    return ServicesCatalog.normalizeFloorKey(value);
  }
  const raw = String(value == null ? "" : value).trim();
  if (!raw) return "";
  const n = raw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (n === "pb" || n.indexOf("planta baja") >= 0 || n === "0") return "PB";
  const m = n.match(/(?:nivel|piso|floor|level|n)\s*(\d+)/) || n.match(/^(\d+)$/);
  return m ? m[1] : raw.toUpperCase();
}

/** Floor where this totem / avatar stands — used to rank nearby bathrooms. */
function getTotemFloorContext() {
  const cfg = window.MAPVX_CONFIG || {};
  const character = window.MALL_CHARACTER || {};
  const params = new URLSearchParams(window.location.search);
  const candidates = [
    cfg.totemFloor,
    cfg.originFloor,
    cfg.floor,
    window.MALL_TOTEM_FLOOR,
    window.MALL_FLOOR,
    window.MALL_CHARACTER_FLOOR,
    character.floor,
    character.Floor,
    params.get("totemFloor"),
    params.get("floor"),
  ];
  for (let i = 0; i < candidates.length; i++) {
    const normalized = normalizeTotemFloorValue(candidates[i]);
    if (normalized) return normalized;
  }
  return "";
}

function rememberTotemFloor(rawFloor) {
  const floor = normalizeTotemFloorValue(rawFloor);
  if (!floor) return "";
  window.MALL_TOTEM_FLOOR = floor;
  if (!window.MAPVX_CONFIG) window.MAPVX_CONFIG = {};
  if (!window.MAPVX_CONFIG.totemFloor) window.MAPVX_CONFIG.totemFloor = floor;
  window.MALL_CHARACTER = Object.assign({}, window.MALL_CHARACTER || {}, { floor: floor });
  return floor;
}

  if (getMobilityMode() === "store_search") return true;
  if (isLocalHtmlMode()) return true;

  if (!getMobilityMode() && !(window.ReactNativeWebView)) return true;

}

  const fromUrl = String(
    params.get("q")
    || params.get("query")
    || params.get("search")
    || params.get("text")

function getMarketSearchMode() {
  if (window.MARKET_SEARCH_UNITY_ONLY === true) return "unity-only";
  if (window.MARKET_SEARCH_LEGACY === true) return "unity-only";
  const explicit = String(window.MARKET_SEARCH_MODE || "").toLowerCase();
  if (explicit === "unity-only" || explicit === "legacy-only") return "unity-only";
  if (explicit === "catalog-only" || explicit === "local-only") return "catalog-only";
  const params = new URLSearchParams(window.location.search);
  const fromUrl = String(params.get("marketSearch") || params.get("market_search") || "").toLowerCase();
  if (fromUrl === "unity-only" || fromUrl === "legacy-only" || fromUrl === "legacy") return "unity-only";
  if (fromUrl === "catalog-only" || fromUrl === "local-only") return "catalog-only";
  return "hybrid";
}

  return getMarketSearchMode() === "unity-only";
}

  return getMarketSearchMode() !== "unity-only";

function formatSpeakTemplate(template, values) {
  let out = String(template || "");
  Object.keys(values || {}).forEach((key) => {
    out = out.split("{" + key + "}").join(String(values[key] != null ? values[key] : ""));
  });
  return out;
}

function isFoodMarketQuery(query) {
  const q = String(query || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
  return /\b(gastronomia|restaurante|restaurantes|almuerzo|cena|desayuno|comida|comer|lunch|dinner|breakfast|food|dining|restaurant)\b/.test(
    q
  );
}

function speakMarketResultsFound(payload) {
  if (typeof SimaBridge === "undefined" || typeof SimaBridge.speak !== "function") return;
  const results = payload.results || [];
  if (!results.length) return;
  const query = payload.query || "";
  const food = payload.resultKind === "restaurants" || isFoodMarketQuery(query);

  if (results.length === 1) {
    const store = results[0];
    const name = store.brand || store.name || query;
    const floor = String(store.floor || "").trim();
    const message = floor
      ? formatSpeakTemplate(t(food ? "restaurantsFoundOneFloor" : "storesFoundOneFloor"), { name, floor })
      : formatSpeakTemplate(t(food ? "restaurantsFoundOne" : "storesFoundOne"), { name });
    SimaBridge.speak(message);
    return;
  }

  SimaBridge.speak(
    formatSpeakTemplate(t(food ? "restaurantsFoundMany" : "storesFoundMany"), {
      count: results.length,
      query,
    })
  );
}

function normalizeMarketQuery(query) {
  return String(query || "").trim().toLowerCase();
}

function localMarketSearchAlreadyResolved(query, seq) {
  const q = normalizeMarketQuery(query);
  return !!(
    q &&
    q === lastLocalMarketSearch.query &&
    (seq == null || lastLocalMarketSearch.seq === seq) &&
    lastMarketPayload &&
    Array.isArray(lastMarketPayload.results) &&
    lastMarketPayload.results.length
  );
}

function normalizeCategoryKey(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function matchesPopularCategoryToken(categoryKey, token) {
  if (!categoryKey || !token) return false;
  return categoryKey === token || categoryKey.indexOf(token + " ") === 0 || categoryKey.indexOf(" " + token) >= 0 || categoryKey.indexOf(token) >= 0;
}

function getPopularCategoryPriorityTokens() {
  return [
    "deportes",
    "sport",
    "moda",
    "fashion",
    "calzado",
    "tecnologia",
    "hogar",
    "gastronomia",
    "belleza",
    "salud",
    "infantil",
  ];
}

function pickPopularCategories(categories, limit) {
  const list = (Array.isArray(categories) ? categories.slice() : []).filter(function (cat) {
    const key = normalizeCategoryKey(cat && (cat.key || cat.name));
    return !!CENCOMALL_CATEGORY_LABEL_BY_KEY[key];
  });
  const max = Math.max(1, Number(limit) || 6);
  if (!list.length) return [];

  const ordered = list.slice().sort((a, b) => {
    if ((b.storeCount || 0) !== (a.storeCount || 0)) return (b.storeCount || 0) - (a.storeCount || 0);
    return String(a.name || "").localeCompare(String(b.name || ""), "es");
  });

  const selected = [];
  const seen = {};
  const tokens = getPopularCategoryPriorityTokens();

  tokens.forEach((token) => {
    if (selected.length >= max) return;
    const match = ordered.find((cat) => {
      const key = normalizeCategoryKey(cat && (cat.key || cat.name));
      if (!key || seen[key]) return false;
      return matchesPopularCategoryToken(key, token);
    });
    if (!match) return;
    const key = normalizeCategoryKey(match.key || match.name);
    seen[key] = true;
    selected.push(match);
  });

  ordered.forEach((cat) => {
    if (selected.length >= max) return;
    const key = normalizeCategoryKey(cat && (cat.key || cat.name));
    if (!key || seen[key]) return;
    seen[key] = true;
    selected.push(cat);
  });

  return selected.slice(0, max);
}

function submitSearchFromFab() {
  const preferred = lastFocusedStoreInputId;
  const inlineInput = document.getElementById("storeSearchInlineInput");
  const landingInput = document.getElementById("storeSearchInput");

  if (preferred === "storeSearchInlineInput" && inlineInput) {
    submitInlineStoreSearch();
    return;

    submitStoreSearch();
    return;

function updateHeaderBackVisibility() {

  const headerClose = document.getElementById("cm-header-close-btn");

function submitInlineStoreSearch() {
  const input = document.getElementById("storeSearchInlineInput");

  if (!query) {

function buildMarketSearchAttempts(query) {
  if (typeof MarketQueryI18n !== "undefined" && MarketQueryI18n.buildSearchAttempts) {
    return MarketQueryI18n.buildSearchAttempts(query, mobilityLocale);
  }

  const attempts = [];
  const seen = new Set();
  const add = (value) => {
    const text = String(value || "").trim();
    const key = normalizeMarketQuery(text);
    if (!text || seen.has(key)) return;
    seen.add(key);
    attempts.push(text);
  };

  add(query);
  return attempts;
}

function ensureStoreSearchReady() {
  const mapView = document.getElementById("map-view");
  if (mapView && !mapView.classList.contains("hidden") && typeof closeMapView === "function") {
    closeMapView();

  const landing = document.getElementById("store-search-landing");
  if (landing) landing.classList.remove("visible");
  const body = document.querySelector(".cm-body");
  if (body) body.style.display = "";
  const fab = document.getElementById("speakFab");
  if (fab) fab.style.display = "";
}

async function runMarketCatalogSearch(query, options) {
  options = options || {};
  if (!shouldUseLocalMarketCatalog()) return null;
  const q = String(query || "").trim();
  if (!q) return null;

  // Last-mile: never run the store catalog for bathroom/elevator/cowork/SAC intents.
  // Voice/AI often calls market search directly and would paint "Sin resultados" (tiendas).
  if (!options.allowServicesAsMarket && looksLikeServicesCatalogQuery(q)) {
    SimaBridge.log("market catalog redirected to services q=" + q);
    runServicesCatalogSearch(q, {
      source: options.source || "market-guard",
      voice: !!options.voice,
      preferFloor: options.preferFloor || getTotemFloorContext() || undefined,
    });
    return null;
  }

  if (typeof MarketSearch === "undefined") {
    if (!options.silent) showSearchError(t("loadError"));
    return null;
  }

  try {
    await MarketSearch.loadCatalog();
    if (!MarketSearch.getCatalogSize()) {
      SimaBridge.log("market catalog empty after load");
      if (!options.silent) showSearchError(t("loadError"));
      return null;
    }

    const attempts = buildMarketSearchAttempts(q);
    const searchFn = (options.voice && typeof MarketSearch.searchVoice === "function")
      ? MarketSearch.searchVoice.bind(MarketSearch)
      : MarketSearch.search.bind(MarketSearch);
    const foodQuery = isFoodMarketQuery(q);
    const defaultLimit = foodQuery ? 80 : 30;

    let searchResult = null;
    let usedQuery = q;

    for (let i = 0; i < attempts.length; i++) {
      const attempt = attempts[i];
      const result = searchFn(attempt, { limit: options.limit || defaultLimit });
      searchResult = result;
      if (result.results && result.results.length) {
        usedQuery = attempt;
        if (attempt !== q) {
          SimaBridge.log(
            "market_search retry q=" + q + " -> " + attempt +
            (result.searchMode ? " mode=" + result.searchMode : "")
          );
        }
        break;
      }
    }

    const payload = {
      type: "market_search",
      query: q,
      searchQuery: usedQuery,
      results: (searchResult && searchResult.results) || [],
      totalMatches: (searchResult && searchResult.totalMatches) || 0,
      catalogSize: (searchResult && searchResult.catalogSize) || MarketSearch.getCatalogSize(),
      source: "market-catalog",
      resultType: (searchResult && searchResult.resultType) || "search",
      isFallbackRelated: !!(searchResult && searchResult.isFallbackRelated),
      resultKind: foodQuery ? "restaurants" : "stores",
    };

    emitMarketSearchResultsToBridge(payload, {
      seq: options.seq != null ? options.seq : marketSearchSeq,
      source: options.source || (options.voice ? "voice" : "text"),
    });

    if (!options.skipRender) {
      renderMarketResults(payload);
      lastLocalMarketSearch = {
        query: normalizeMarketQuery(q),
        seq: options.seq != null ? options.seq : marketSearchSeq,
      };
    }

    return payload;
  } catch (e) {
    console.error("runMarketCatalogSearch failed", e);
    SimaBridge.log("market catalog search failed: " + (e.message || e));
    if (!options.silent) showSearchError(t("loadError"));
    return null;
  }
}

function emitMarketSearchResultsToBridge(searchPayload, options) {
  options = options || {};
  if (typeof MarketSearch === "undefined" || typeof MarketSearch.toBridgeSearchPayload !== "function") {
    return null;
  }
  if (!SimaBridge || typeof SimaBridge.send !== "function") return null;

  const bridgePayload = MarketSearch.toBridgeSearchPayload(searchPayload || {}, {
    query: (searchPayload && searchPayload.query) || options.query || "",
    seq: options.seq,
    topN: options.topN || 8,
  });
  // Always emit — including totalMatches: 0 — so RN/IA can continue without inventing stores.
  SimaBridge.send("market_search_results", {
    query: bridgePayload.query,
    seq: bridgePayload.seq,
    totalMatches: bridgePayload.totalMatches,
    results: bridgePayload.results,
    source: options.source || (searchPayload && searchPayload.source) || "market-catalog",
  });
  return bridgePayload;
}

function prefetchMarketCatalog() {
  if (!shouldUseLocalMarketCatalog()) return;
  if (typeof MarketI18n !== "undefined" && MarketI18n.loadOverlay) {
    MarketI18n.loadOverlay()
      .then(function () {
        if (mobilityLocale !== "es") applyMobilityLocale();
      })
      .catch(function (e) {
        console.warn("market i18n prefetch failed", e);
      });
  }
  if (typeof MarketSearch === "undefined" || !MarketSearch.loadCatalog) return;
  MarketSearch.loadCatalog()
    .then(function () {
      SimaBridge.log("market catalog ready count=" + MarketSearch.getCatalogSize());
    })
    .catch(function (e) {
      console.warn("market catalog prefetch failed", e);
    });
}

function prefetchServicesCatalog() {
  if (typeof ServicesCatalog === "undefined" || !ServicesCatalog.loadCatalog) return;
  ServicesCatalog.loadCatalog()
    .then(function () {

function runServicesCatalogSearch(query, options) {
  options = options || {};
  const q = String(query || "").trim();
  const serviceId = options.serviceId ? String(options.serviceId).trim() : "";
  if ((!q && !serviceId) || typeof ServicesCatalog === "undefined" || !ServicesCatalog.search) {
    return false;
  }

  ensureStoreSearchReady();

  const totemFloor = getTotemFloorContext();
  ServicesCatalog.loadCatalog()
    .then(function () {
      const searchOpts = Object.assign({}, options, {
        serviceId: serviceId || options.serviceId,
        preferFloor: options.preferFloor || options.totemFloor || totemFloor || undefined,
      });
      const results = ServicesCatalog.search(q || serviceId, searchOpts);
      const displayQuery = q || (results[0] && results[0].name) || serviceId;
      SimaBridge.log(
        "services_catalog_search q=" + displayQuery +
        " results=" + results.length +
        " totemFloor=" + (totemFloor || "-") +
        " source=" + (options.source || "local")
      );
      renderServicesResults({
        type: "services_search",
        query: displayQuery,
        results: results,
        source: options.source || "local-catalog",
        mall: "costanera",
        totemFloor: totemFloor || "",
      });
      const willAutoMap = !!(results.length && (options.autoMap || wantsAutoOpenServiceMap()));
      if (!willAutoMap) {
        if (results.length === 1 && results[0].description) {
          SimaBridge.speak(results[0].description);
        } else if (results.length > 1) {
          SimaBridge.speak(t("services") + ": " + results.length + " " + (t("options") || "opciones"));
        } else if (!results.length) {
          SimaBridge.speak(t("servicesNotFound"));
        }
      }
      if (willAutoMap) {
        clearAutoMapLaunchParams();
        // No artificial delay on deep-link: shell is already the map view.
        const delayMs = document.documentElement.classList.contains("auto-map-launch") ? 0 : 280;
        window.setTimeout(function () {
          openServiceMap(0, options);
        }, delayMs);
      } else {
        clearAutoMapLaunchUi();
      }
    })
    .catch(function (e) {
      clearAutoMapLaunchUi();
      showSearchError(t("loadErrorTitle") + ": " + (e.message || e));
    });
  return true;
}

function enrichServicesSearchPayload(data) {
  if (!data || typeof ServicesCatalog === "undefined" || !ServicesCatalog.getById) return data;
  if (!Array.isArray(data.results)) return data;
  data.results = data.results.map(function (row) {
    const id = row && (row.id || row.catalogId);
    if (!id || !ServicesCatalog.isReady || !ServicesCatalog.isReady()) return row;
    const entry = ServicesCatalog.getById(id);
    if (!entry) return row;
    const card = ServicesCatalog.toResultCard(entry);
    return Object.assign({}, card, row, {
      name: row.name || card.name,
      description: row.description || card.description,
      location: row.location || card.location,
      floors: row.floors && row.floors.length ? row.floors : card.floors,
      anchorLocal: row.anchorLocal || card.anchorLocal,
      anchorBrand: row.anchorBrand || card.anchorBrand,
      routeApproachQuery: row.routeApproachQuery || card.routeApproachQuery,
      routeApproachLocal: row.routeApproachLocal || card.routeApproachLocal,
      routeApproachWeight: row.routeApproachWeight != null ? row.routeApproachWeight : card.routeApproachWeight,
      routeApproachMaxMeters: row.routeApproachMaxMeters != null ? row.routeApproachMaxMeters : card.routeApproachMaxMeters,
      routeApproachPullFrom: row.routeApproachPullFrom || card.routeApproachPullFrom,
      poiRef: row.poiRef || card.poiRef,
      mapvxId: row.mapvxId || card.mapvxId,
      mapvxLat: row.mapvxLat != null ? row.mapvxLat : card.mapvxLat,
      mapvxLng: row.mapvxLng != null ? row.mapvxLng : card.mapvxLng,
      mapvxSearchQueries:
        (row.mapvxSearchQueries && row.mapvxSearchQueries.length)
          ? row.mapvxSearchQueries
          : card.mapvxSearchQueries,
      features: row.features || card.features,
    });
  });
  return data;
}

function getInitialServiceId() {
  const params = new URLSearchParams(window.location.search);
  return String(
    window.MALL_SERVICE_ID
    || params.get("service")
    || params.get("serviceId")
    || ""
  ).trim();
}

function isCustomerServiceRouteFromServicios() {
  try {
    const params = new URLSearchParams(window.location.search);
    return params.get("from") === "servicios";
  } catch (e) {
    return false;
  }
}

function consumePendingServiceRoute() {
  const key = "sima_pending_service_route";
  let raw = "";
  try { raw = sessionStorage.getItem(key) || ""; } catch (eSessionRead) { /* noop */ }
  if (!raw) {
    try { raw = localStorage.getItem(key) || ""; } catch (eLocalRead) { /* query-string launch remains available */ }
  }

  // Always consume both copies so this route cannot affect later openings.
  try { sessionStorage.removeItem(key); } catch (eSession) { /* noop */ }
  try { localStorage.removeItem(key); } catch (eLocal) { /* noop */ }

  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    if (parsed.expiresAt && Number(parsed.expiresAt) < Date.now()) return null;
    return parsed;
  } catch (eParse) {
    return null;
  }
}

function wantsAutoOpenServiceMap(extra) {
  const params = new URLSearchParams(window.location.search);
  if (
    params.get("autoMap") === "1"
    || params.get("autoRoute") === "1"
    || window.MALL_SERVICE_AUTO_MAP === true
    || window.MALL_SERVICE_AUTO_MAP === "1"
  ) {
    return true;
  }
  if (extra && (extra.autoMap || extra.autoRoute || extra.autoMap === "1" || extra.autoRoute === "1")) {
    return true;
  }
  return false;
}

function wantsAutoOpenServiceRoute(extra) {
  const params = new URLSearchParams(window.location.search);
  if (params.get("autoRoute") === "1") return true;
  return !!(extra && (extra.autoRoute === true || extra.autoRoute === "1"));
}

function clearAutoMapLaunchParams() {
  try {
    const url = new URL(window.location.href);
    if (!url.searchParams.has("autoMap") && !url.searchParams.has("autoRoute")) return;
    url.searchParams.delete("autoMap");
    url.searchParams.delete("autoRoute");
    window.history.replaceState({}, "", url.pathname + url.search + url.hash);
  } catch (e) { /* noop */ }
}

function getInitialServiceQuery() {
  const params = new URLSearchParams(window.location.search);
  return String(
    window.MALL_SERVICE_QUERY
    || params.get("serviceQuery")
    || params.get("serviceQ")
    || ""
  ).trim();
}

function looksLikeServicesCatalogQuery(query) {
  if (typeof ServicesCatalog === "undefined") return false;
  if (ServicesCatalog.looksLikeServicesQuery) {
    return ServicesCatalog.looksLikeServicesQuery(query);
  }
  return !!(ServicesCatalog.looksLikeBathroomQuery && ServicesCatalog.looksLikeBathroomQuery(query));
}

function routeUnifiedSearch(query, options) {
  options = options || {};
  const q = String(query || "").trim();
  if (!q) return false;

  marketSearchSeq++;
  setStoreSearchInputs(q);

  if (looksLikeServicesCatalogQuery(q)) {
    // Do NOT notify native services_search here: RN/backend returns legacy
    // mall services (cajero, mudadores agregados) and would overwrite the
    // local bathroom catalog results on the totem.
    SimaBridge.log("services_search local-catalog q=" + q);
    return runServicesCatalogSearch(q, Object.assign({ source: options.source || "text" }, options));
  }

  if (shouldNotifyUnityMarketSearch()) {
    SimaBridge.send("market_search", {
      text: q,
      source: options.source || "text",
      locale: mobilityLocale,
    });
  }
  if (shouldUseLocalMarketCatalog()) {
    runMarketCatalogSearch(q, { seq: marketSearchSeq, voice: !!options.voice });
  }
  return true;
}

function initStoreSearchLanding() {
  if (!shouldShowStoreSearchLanding()) return;
  // Avoid mounting/focusing the searcher when we are deep-linking into the map.
  if (document.documentElement.classList.contains("auto-map-launch")) return;
  // Voice/RN launch with a query: keep boot loading, never paint empty searcher.
  if (
    document.documentElement.classList.contains("search-boot-loading")
    || getInitialSearchQuery()
    || (typeof getInitialServiceId === "function" && getInitialServiceId())
  ) {
    const bootQ = getInitialSearchQuery();
    if (bootQ) showSearchInProgress(bootQ);
    return;
  }

  applyStoreSearchLandingLocale();
  wireStoreSearchLandingEvents();
  renderPopularCategoriesLanding();
  showStoreSearchLanding(true);

  const input = document.getElementById("storeSearchInput");
  if (input) window.setTimeout(() => input.focus(), 300);
}

function applyMobilityLocale() {
  mobilityLocale = getMobilityLocale();
  document.documentElement.lang = mobilityLocale;
  MAP_SERVICE_BASE_URL = window.MALL_MAP_BASE_URL || MAP_SERVICE_BASE_URL || "";
  if (window.MAPVX_CONFIG) {
    window.MAPVX_CONFIG.lang = mobilityLocale;
  }

  const welcome = document.getElementById("welcome-hint");
  if (welcome) welcome.textContent = t("welcomeHint");

  applyStoreSearchLandingLocale();
  const hasResults = !!(lastMarketPayload && Array.isArray(lastMarketPayload.results) && lastMarketPayload.results.length);
  const landingVisible = document.getElementById("store-search-landing");
  if (
    shouldShowStoreSearchLanding()
    && !hasResults
    && landingVisible
    && !document.documentElement.classList.contains("search-boot-loading")
  ) {
    showStoreSearchLanding(true);
  }

  const speakBtn = document.getElementById("btnSpeak");
  if (speakBtn) speakBtn.textContent = speakButtonLabel();

  const speakMini = document.getElementById("btnSpeakMini");
  if (speakMini) {
    speakMini.textContent = t("speakMicShort");
    speakMini.setAttribute("aria-label", speakButtonLabel());
    speakMini.title = speakButtonLabel();
  }

  const speakSearch = document.getElementById("btnSpeakSearch");
  if (speakSearch) speakSearch.setAttribute("aria-label", speakButtonLabel());

  const surveyTitle = document.getElementById("survey-title");
  if (surveyTitle) surveyTitle.textContent = t("surveyTitle");

  const surveyHint = document.getElementById("survey-hint");
  if (surveyHint) surveyHint.textContent = t("surveyHint");

  const surveyStrip = document.getElementById("survey-strip");
  if (surveyStrip) surveyStrip.setAttribute("aria-label", t("surveyAriaLabel"));

  const surveyDismissBtn = document.getElementById("survey-dismiss-btn");
  if (surveyDismissBtn) surveyDismissBtn.setAttribute("aria-label", t("surveyDismiss"));

  const mapBack = document.getElementById("map-back-btn");
  if (mapBack) mapBack.setAttribute("aria-label", t("back").replace(/^←\s*/, ""));

  const headerBack = document.getElementById("cm-header-back-btn");
  if (headerBack) headerBack.setAttribute("aria-label", t("back").replace(/^←\s*/, ""));

  const headerClose = document.getElementById("cm-header-close-btn");
  if (headerClose) headerClose.setAttribute("aria-label", t("close"));

  const mapTitle = document.getElementById("map-view-title-text");
  if (mapTitle) mapTitle.textContent = t("map");

  const mapRouteBtn = document.getElementById("map-route-btn");
  if (mapRouteBtn && !mapRouteBtn.classList.contains("hidden")) {
    mapRouteBtn.textContent = t("viewRoute");
  }

  if (lastMarketPayload) renderMarketResults(lastMarketPayload);
  if (lastPromotionPayload) renderPromotionResults(lastPromotionPayload);
  if (lastServicesPayload) renderServicesResults(lastServicesPayload);

  const landing = document.getElementById("store-search-landing");
  if (landing && landing.classList.contains("visible")) {
    renderPopularCategoriesLanding();
  }

  const categoriesGrid = document.querySelector(".cm-category-grid, .cm-category-list");
  if (
    categoriesGrid &&
    !(lastMarketPayload && lastMarketPayload.resultType === "az") &&
    typeof MarketSearch !== "undefined" &&
    MarketSearch.listCategories
  ) {
    try {
      const data = MarketSearch.listCategories();
      if (data.categories && data.categories.length) renderStoreCategories(data.categories);
    } catch (e) { /* noop */ }
  }

  const surveyStripEl = document.getElementById("survey-strip");
  if (surveyStripEl && !surveyStripEl.classList.contains("hidden") && !surveyStripEl.classList.contains("is-thanks")) {
    renderEntrySurvey();
  }

  updateMapZoomMeter();
  updateHeaderBackVisibility();
}

function closeWebview() {
  try {
    if (window.SimaBridge && typeof window.SimaBridge.requestClose === "function") {
      window.SimaBridge.requestClose();
      return;
    }
  } catch (e) {}
  try {
    if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === "function") {
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: "close_webview",
        payload: {},
      }));
      return;
    }
  } catch (e2) {}
  try {
    if (window.SimaBridge && typeof window.SimaBridge.send === "function") {
      window.SimaBridge.send("close_webview", {});
    }

}

function handleMobilityBack() {
  const mapView = document.getElementById("map-view");
  if (mapView && !mapView.classList.contains("hidden")) {
    closeMapView();
    return;
  }

  // If a store detail panel is open, close it first (prefer intra-mobility back)
  const storeDetailPanel = document.getElementById("store-detail-panel");
  if (storeDetailPanel && !storeDetailPanel.classList.contains("hidden")) {
    hideStoreDetailPanel();
    return;
  }

  // Use the navigation stack to decide where to go back.
  try {
    const stack = window.mobilityNavStack || ["landing"];
    if (stack.length > 1) {
      // pop current view and navigate to the new top
      popMobilityView();
      const top = currentMobilityView();
      if (top === "landing") {
        returnToStoreSearchLanding();
        return;
      }
      if (top === "categories") {
        openStoreCategories();
        return;
      }
        if (top === "categoryResults") {
        if (lastMarketPayload && lastMarketPayload.resultType === "category") {
          renderMarketResults(lastMarketPayload);
        } else {
          // fallback: show categories
          openStoreCategories();
        }
        return;
      }
      if (top === "gastronomySubcategoryResults") {
        if (lastMarketPayload && lastMarketPayload.resultType === "subcategory") {
          renderMarketResults(lastMarketPayload);
        } else {
          openGastronomySubcategories(false);
        }
        return;
      }
      if (top === "gastronomyCategories") {
        openGastronomySubcategories(false);
        return;
      }
      if (top === "az") {
        if (lastMarketPayload && lastMarketPayload.resultType === "az") {
          renderMarketResults(lastMarketPayload);
        } else {
          openStoreCategories();
        }
        return;
      }
      if (top === "storeDetail") {
        hideStoreDetailPanel();
        return;
      }
      if (top === "map") {
        closeMapView();
        return;
      }
    }
  } catch (e) { /* noop */ }

  // If stack is at root or above failed, close the webview when on landing.
  if (isShowingStoreSearchLanding()) {
    if (backToServiciosIfNeeded()) {
      window.location.href = "../servicios/index.html";
      return;
    }
    closeWebview();
    return;
  }

  // final fallback: return to landing
  if (backToServiciosIfNeeded()) {
    window.location.href = "../servicios/index.html";
    return;
  }
  returnToStoreSearchLanding();
}

window.handleMobilityBack = handleMobilityBack;

function normalizeCategoryKey(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function resolveCenco20Categories(categories) {
  const byKey = {};
  (categories || []).forEach(function (c) {
    if (!c || !c.key) return;
    byKey[String(c.key)] = c;
  });

  const list = [];
  CENCOMALL_CATEGORIES_20.forEach(function (label) {
    const key = normalizeCategoryKey(label);
    const match = byKey[key];
    if (!match) {
      // Fallback: try to find a category where its normalized name matches.
      const relaxed = (categories || []).find(function (c) {
        return c && normalizeCategoryKey(c.name) === key;
      });
      if (!relaxed) {
        console.warn("Missing cenco category in local catalog:", label, "key=", key);
        return;
      }
      list.push({ key, label, storeCount: relaxed.storeCount || 0 });
      return;
    }
    list.push({ key, label, storeCount: match.storeCount || 0 });
  });
  return list;
}

function renderStoreCategories(categories) {
  hideWelcome();

  if (!categories.length) {
    document.getElementById("resultado").innerHTML = `
      <div class="cm-panel fade-in">
        <div class="cm-empty">
          <div class="cm-empty-title">${escapeHtml(t("categories"))}</div>
          <div class="cm-empty-copy">${escapeHtml(t("categoriesEmpty"))}</div>
        </div>
      </div>`;
    return;
  }

  const baseCategories = categories.slice(0);
  let currentTab = "categories";
  let azStoreResults = Array.isArray(cachedAZStoreResults) ? cachedAZStoreResults.slice(0) : null;
  let letterIndexObserver = null;
  const LETTER_INDEX_KEYS = ["#"].concat("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")).concat(["Ñ"]);

  function getNameAZLetter(value) {
    const name = String(value || "").trim();
    if (!name) return "#";
    const first = name.charAt(0).toUpperCase();
    if (/[0-9]/.test(first)) return "#";
    if (first === "Ñ") return "Ñ";
    const base = first.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (/[A-Z]/.test(base)) return base;
    return "#";
  }

  function getStoreAZLetter(store) {
    return getNameAZLetter(store && (store.brand || store.name));
  }

  function collectAvailableLetters(tab) {
    const available = {};
    if (tab === "az") {
      (azStoreResults || []).forEach(function (store) {
        available[getStoreAZLetter(store)] = true;
      });
    } else {
      baseCategories.forEach(function (cat) {
        available[getNameAZLetter(cat.label || cat.key)] = true;
      });
    }
    return available;
  }

  function buildLetterIndexHtml(availableMap, activeLetter) {
    return LETTER_INDEX_KEYS.map(function (letter) {
      const enabled = !!(availableMap && availableMap[letter]);
      const active = enabled && activeLetter === letter;
      const classes = [
        "cm-letter-index-btn",
        enabled ? "" : "is-disabled",
        active ? "is-active" : "",
      ].filter(Boolean).join(" ");
      return `
        <button class="${classes}" type="button"
          data-letter="${escapeHtml(letter)}"
          ${enabled ? `onclick="jumpToDirectoryLetter('${escapeHtml(letter)}')"` : "disabled"}
          aria-label="${escapeHtml(letter)}"
          aria-disabled="${enabled ? "false" : "true"}">${escapeHtml(letter)}</button>`;
    }).join("");
  }

  function refreshLetterIndex(activeLetter) {
    const nav = document.getElementById("cm-letter-index");
    if (!nav) return;
    const available = collectAvailableLetters(currentTab);
    const firstEnabled = LETTER_INDEX_KEYS.find(function (l) { return available[l]; }) || "";
    nav.innerHTML = buildLetterIndexHtml(available, activeLetter || firstEnabled);
  }

  function setActiveLetterIndex(letter) {
    const nav = document.getElementById("cm-letter-index");
    if (!nav) return;
    nav.querySelectorAll(".cm-letter-index-btn").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.getAttribute("data-letter") === letter);
    });
  }

  function disconnectLetterIndexObserver() {
    if (letterIndexObserver) {
      letterIndexObserver.disconnect();
      letterIndexObserver = null;
    }
  }

  function bindLetterIndexObserver() {
    disconnectLetterIndexObserver();
    const listWrap = document.getElementById("cm-category-list-wrap");
    if (!listWrap || typeof IntersectionObserver === "undefined") return;

    const targets = listWrap.querySelectorAll("[data-letter]");
    if (!targets.length) return;

    letterIndexObserver = new IntersectionObserver(function (entries) {
      const visible = entries
        .filter(function (e) { return e.isIntersecting; })
        .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (!visible.length) return;
      const letter = visible[0].target.getAttribute("data-letter");
      if (letter) setActiveLetterIndex(letter);
    }, {
      root: null,
      rootMargin: "-30% 0px -55% 0px",
      threshold: [0, 0.1, 1],
    });

    targets.forEach(function (el) { letterIndexObserver.observe(el); });
  }

  window.jumpToDirectoryLetter = function (letter) {
    const key = String(letter || "");
    if (!key) return;
    const listWrap = document.getElementById("cm-category-list-wrap");
    if (!listWrap) return;
    const target = listWrap.querySelector('[data-letter="' + key.replace(/"/g, "") + '"]');
    if (!target) return;
    setActiveLetterIndex(key);
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  function buildCategoryRows(categoryList) {
    return categoryList
      .map(function (cat) {
        const jsKey = encodeURIComponent(String(cat.key || ""));
        const iconBaseSrc = cat.iconSrc || CENCOMALL_CATEGORY_ICON_BY_KEY[String(cat.key || "")] || "";
        const iconSrc = iconBaseSrc ? (iconBaseSrc + "?v=" + encodeURIComponent(CENCOMALL_CATEGORY_ICON_VERSION)) : "../shared/category-icons/default.svg";
        const letter = getNameAZLetter(cat.label || cat.key);
        var action = cat.onclick || "selectStoreCategory(decodeURIComponent('" + jsKey + "'))";
      return `
          <button class="cm-category-row" type="button" data-letter="${escapeHtml(letter)}"
            onclick="${action}"
            aria-label="${escapeHtml(cat.label)}">
            <div class="cm-category-row-left">
              <img class="cm-category-row-icon" src="${escapeHtml(iconSrc)}" alt="" aria-hidden="true" loading="lazy" />
              <div class="cm-category-row-text">
                <div class="cm-category-row-name">${escapeHtml(cat.label)}</div>
                <div class="cm-category-row-count">${escapeHtml(String(cat.storeCount || 0))} ${escapeHtml(t("storesInCategory"))}</div>
              </div>
            </div>
            <svg class="cm-category-row-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/>
            </svg>
          </button>`;
      })
      .join("");
  }

  function groupStoresByAZLetter(stores) {
    const groups = {};
    (stores || []).forEach(function (store) {
      const letter = getStoreAZLetter(store);
      if (!groups[letter]) groups[letter] = [];
      groups[letter].push(store);
    });
    const letters = Object.keys(groups).sort(function (a, b) {
      if (a === "#") return -1;
      if (b === "#") return 1;
      return a.localeCompare(b, "es");
    });
    return letters.map(function (letter) {
      return { letter: letter, stores: groups[letter] };
    });
  }

  function buildAZStoreRows(stores) {
    if (!stores || !stores.length) {
      return `
        <div class="cm-empty">
          <div class="cm-empty-copy">${escapeHtml(t("storesNotFound"))}</div>
        </div>`;
    }
    // Flat index must match lastMarketPayload.results for openStoreMap(idx).
    let flatIdx = 0;
    return groupStoresByAZLetter(stores)
      .map(function (group) {
        const rows = group.stores
          .map(function (store) {
            const idx = flatIdx++;
            const name = String((store && (store.brand || store.name)) || "Tienda");
            return `
              <button class="cm-az-store-row" type="button"
                onclick="openStoreMap(${idx})"
                aria-label="${escapeHtml(name)}">
                <div class="cm-az-store-left">
                  ${renderAZStoreIcon(store)}
                  <span class="cm-az-store-name">${escapeHtml(name)}</span>
                </div>
                <svg class="cm-category-row-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/>
                </svg>
              </button>`;
          })
          .join("");
        return `<div class="cm-az-letter" role="heading" aria-level="3" data-letter="${escapeHtml(group.letter)}" id="az-section-${escapeHtml(group.letter)}">${escapeHtml(group.letter)}</div>${rows}`;
      })
      .join("");
  }

  function updateCategoriesHead(tab, storeCount) {
    const titleEl = document.getElementById("cm-categories-title");
    const countEl = document.getElementById("cm-categories-count");
    const hintEl = document.getElementById("cm-categories-hint");
    if (tab === "az") {
      if (titleEl) titleEl.textContent = "A-Z";
      if (countEl) countEl.textContent = String(storeCount || 0);
      if (hintEl) hintEl.textContent = "";
    } else {
      if (titleEl) titleEl.textContent = t("categories");
      if (countEl) countEl.textContent = String(baseCategories.length);
      if (hintEl) hintEl.textContent = t("categoriesHint");
    }
  }

  function commitAZPayload(stores) {
    cachedAZStoreResults = stores || [];
    lastMarketPayload = {
      type: "market_search",
      query: "A-Z",
      results: stores || [],
      totalMatches: (stores || []).length,
      catalogSize: MarketSearch.getCatalogSize ? MarketSearch.getCatalogSize() : (stores || []).length,
      source: "market-catalog-az",
      resultType: "az",
    };
  }

  async function computeAZStoreResults() {
    const seen = {};
    const stores = [];
    for (let i = 0; i < baseCategories.length; i++) {
      const cat = baseCategories[i];
      try {
        const res = MarketSearch.searchByCategory(cat.key, { limit: 200 });
        if (res && Array.isArray(res.results) && res.results.length) {
          res.results.forEach(function (store) {
            const dedupeKey = normalizeCategoryKey(store && (store.brand || store.name || store.id || ""));
            if (!dedupeKey || seen[dedupeKey]) return;
            seen[dedupeKey] = true;
            stores.push(store);
          });
        }
      } catch (e) {
        // Ignore category if it fails to resolve.
      }
      if (i % 4 === 3) await new Promise(function (r) { return setTimeout(r, 0); });
    }
    stores.sort(function (a, b) {
      const an = String((a && (a.brand || a.name)) || "");
      const bn = String((b && (b.brand || b.name)) || "");
      const al = getStoreAZLetter(a);
      const bl = getStoreAZLetter(b);
      if (al === "#" && bl !== "#") return -1;
      if (bl === "#" && al !== "#") return 1;
      return an.localeCompare(bn, "es", { sensitivity: "base", numeric: true });
    });
    return stores;
  }

  function paintAZList(stores) {
    const listWrap = document.getElementById("cm-category-list-wrap");
    if (!listWrap) return;
    commitAZPayload(stores);
    updateCategoriesHead("az", (stores || []).length);
    listWrap.innerHTML = buildAZStoreRows(stores || []);
    refreshLetterIndex();
    bindLetterIndexObserver();
  }

  window.setStoreCategoriesTab = function (tab) {
    if (tab !== "categories" && tab !== "az") return;
    currentTab = tab;

    const tabsWrap = document.getElementById("cm-category-tabs-wrap");
    if (tabsWrap) {
      const catBtn = tabsWrap.querySelector('[data-tab="categories"]');
      const azBtn = tabsWrap.querySelector('[data-tab="az"]');
      if (catBtn) {
        catBtn.classList.toggle("is-active", tab === "categories");
        catBtn.setAttribute("aria-selected", tab === "categories" ? "true" : "false");
      }
      if (azBtn) {
        azBtn.classList.toggle("is-active", tab === "az");
        azBtn.setAttribute("aria-selected", tab === "az" ? "true" : "false");
      }
    }

    if (tab === "categories") {
      const listWrap = document.getElementById("cm-category-list-wrap");
      if (!listWrap) return;
      updateCategoriesHead("categories");
      listWrap.innerHTML = buildCategoryRows(baseCategories);
      refreshLetterIndex();
      bindLetterIndexObserver();
      return;
    }

    // A-Z: same panel, stores grouped by first letter (# for numbers).
    const listWrap = document.getElementById("cm-category-list-wrap");
    if (!listWrap) return;

    if (azStoreResults) {
      paintAZList(azStoreResults);
      return;
    }

    listWrap.innerHTML = `
      <div class="cm-empty">
        <div class="cm-empty-copy">${escapeHtml(t("categoriesLoading"))}</div>
      </div>`;
    updateCategoriesHead("az", "…");
    refreshLetterIndex();

    computeAZStoreResults().then(function (stores) {
      azStoreResults = stores || [];
      if (currentTab !== "az") return;
      paintAZList(azStoreResults);
    }).catch(function () {
      if (currentTab !== "az") return;
      azStoreResults = [];
      paintAZList([]);
    });
  };

  document.getElementById("resultado").innerHTML = `
    <div class="cm-panel fade-in">
      <div class="cm-results-sticky">
        <button class="cm-back-link" type="button" onclick="returnToStoreSearchLanding()">${escapeHtml(t("backSearch"))}</button>
        <div class="cm-results-head">
          <h2 class="cm-results-title" id="cm-categories-title">${escapeHtml(t("categories"))}</h2>

async function selectStoreCategory(categoryName) {
  if (!shouldUseLocalMarketCatalog()) return;
  const name = String(categoryName || "").trim();
  if (!name || typeof MarketSearch === "undefined") return;

  try {
    await MarketSearch.loadCatalog();
    const searchResult = MarketSearch.searchByCategory(name, { limit: 200 });
    const payload = {
      type: "market_search",
      query: name,
      results: searchResult.results || [],
      totalMatches: searchResult.totalMatches || 0,
      catalogSize: searchResult.catalogSize || MarketSearch.getCatalogSize(),
      source: "market-catalog",
      resultType: "category",
    };
    emitMarketSearchResultsToBridge(payload, {
      seq: marketSearchSeq,
      source: "category",
    });
    renderMarketResults(payload);
    // navigation: category results
    try { pushMobilityView('categoryResults'); } catch (e) {}
    SimaBridge.send("market_search", { text: name, category: name, source: "category" });
  } catch (e) {
    console.error("selectStoreCategory failed", e);
    showSearchError(t("loadError"));
  }
}

function ingestMarketSearchPayload(data) {
  const query = (typeof SimaNativePayload !== "undefined" && SimaNativePayload.extractSearchQuery)
    ? SimaNativePayload.extractSearchQuery(data)
    : String(data.query || data.text || data.q || "").trim();
  const hasResults = Array.isArray(data.results);

  if (query) {
    // Voice/AI often arrives as market_search even for bathrooms/elevators/cowork/SAC.
    // If we still paint native store results, they overwrite the correct local services UI
    // (classic false positive: "baños" → swimsuit keywords in the store catalog).
    if (looksLikeServicesCatalogQuery(query)) {
      SimaBridge.log(
        "market_search redirected to services local-catalog q=" + query +
        " ignoredNativeResults=" + (hasResults ? data.results.length : 0)
      );
      dispatchVoiceSearch(query, data.source || (data.transcript ? "voice" : "native"));
      return true;
    }

    dispatchVoiceSearch(query, data.source || (data.transcript ? "voice" : "native"));
    if (hasResults && data.results.length > 0) {
      window.setTimeout(function () {
        renderMarketResults(Object.assign({}, data, {
          query: query,
          source: data.source || "unity",
        }));
      }, 0);
    }
    return true;
  }

  renderIncomingPayload(data);
  return false;
}

let voiceListeningActive = false;
let voiceListenTimeoutId = null;
let browserSpeechRecognition = null;

function clearVoiceListenTimeout() {
  if (voiceListenTimeoutId != null) {
    window.clearTimeout(voiceListenTimeoutId);
    voiceListenTimeoutId = null;
  }
}

function setVoiceListeningState(active, labelKey) {
  voiceListeningActive = !!active;
  const fab = document.getElementById("speakFab");
  const speakBtn = document.getElementById("btnSpeak");
  const speakMini = document.getElementById("btnSpeakMini");
  const label = labelKey ? t(labelKey) : speakButtonLabel();

  if (fab) fab.classList.toggle("is-listening", voiceListeningActive);
  if (speakBtn) {
    speakBtn.classList.toggle("is-listening", voiceListeningActive);
    speakBtn.textContent = voiceListeningActive ? label : speakButtonLabel();
    speakBtn.disabled = false;
  }
  if (speakMini) {
    speakMini.classList.toggle("is-listening", voiceListeningActive);
    speakMini.disabled = false;
  }

  if (!voiceListeningActive) clearVoiceListenTimeout();
}

function scheduleVoiceListenTimeout(ms) {
  clearVoiceListenTimeout();
  voiceListenTimeoutId = window.setTimeout(function () {
    if (!voiceListeningActive) return;
    setVoiceListeningState(false);
    SimaBridge.log("voice_listen_timeout");
  }, ms || 45000);
}

function getSpeechRecognitionLocale() {
  const locale = String(mobilityLocale || "es").toLowerCase();
  if (locale === "en") return "en-US";
  if (locale === "pt") return "pt-BR";
  return "es-CL";
}

function stopBrowserSpeechRecognition() {
  if (!browserSpeechRecognition) return;
  try { browserSpeechRecognition.abort(); } catch (e) { /* noop */ }
  browserSpeechRecognition = null;
}

function tryBrowserSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return false;

  stopBrowserSpeechRecognition();
  const recognition = new SpeechRecognition();
  browserSpeechRecognition = recognition;
  recognition.lang = getSpeechRecognitionLocale();
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.continuous = false;

  recognition.onstart = function () {
    setVoiceListeningState(true, "voiceListening");
    SimaBridge.log("browser_stt_started locale=" + recognition.lang);
  };

  recognition.onresult = function (event) {
    const transcript = String(
      event.results
      && event.results[0]
      && event.results[0][0]
      && event.results[0][0].transcript
      || ""
    ).trim();
    setVoiceListeningState(false);
    browserSpeechRecognition = null;
    if (!transcript) {
      showSearchError(t("voiceNoSpeech"));
      return;
    }
    SimaBridge.log("browser_stt_result q=" + transcript);
    buscarDesdeVoz({
      type: "market_search",
      query: transcript,
      text: transcript,
      source: "browser-stt",
      locale: mobilityLocale,
    });
  };

  recognition.onerror = function (event) {
    setVoiceListeningState(false);
    browserSpeechRecognition = null;
    const code = String(event && event.error || "");
    SimaBridge.log("browser_stt_error code=" + code);
    if (code === "no-speech" || code === "aborted") {
      if (code === "no-speech") showSearchError(t("voiceNoSpeech"));
      return;
    }
    showSearchError(t("voiceError"));
  };

  recognition.onend = function () {
    browserSpeechRecognition = null;
    if (voiceListeningActive) setVoiceListeningState(false);
  };

  try {
    recognition.start();
    return true;
  } catch (error) {
    browserSpeechRecognition = null;
    setVoiceListeningState(false);
    SimaBridge.log("browser_stt_start_failed " + (error && error.message ? error.message : error));
    return false;
  }
}

function handleVoiceNativeMessage(raw) {
  const data = (typeof SimaNativePayload !== "undefined" && SimaNativePayload.normalize)
    ? SimaNativePayload.normalize(raw)
    : raw;
  if (!data || typeof data !== "object") return false;

  const type = String(data.type || data.command || "").toLowerCase();
  if (type === "stt_started" || type === "stt_listening" || type === "voice_listening") {
    setVoiceListeningState(true, "voiceListening");
    scheduleVoiceListenTimeout();
    return true;
  }
  if (
    type === "stt_error"
    || type === "stt_cancel"
    || type === "stt_cancelled"
    || type === "stt_timeout"
    || type === "stt_end"
    || type === "voice_cancel"
  ) {
    setVoiceListeningState(false);
    if (type === "stt_error") {
      showSearchError(String(data.message || data.error || t("voiceError")));
    }
    return true;
  }
  return false;
}

function decodeBase64Utf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
