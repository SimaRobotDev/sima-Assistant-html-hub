function dispatchVoiceSearch(query, source) {
  const q = String(query || "").trim();
  if (!q) return false;

  setVoiceListeningState(false);
  stopBrowserSpeechRecognition();

  ensureStoreSearchReady();
  showSearchInProgress(q);

  const prepared = (typeof MarketQueryI18n !== "undefined" && MarketQueryI18n.prepareVoiceQuery)
    ? String(MarketQueryI18n.prepareVoiceQuery(q, mobilityLocale) || "").trim()
    : q;
  const searchText = prepared || q;

  setStoreSearchInputs(q);

  marketSearchSeq++;
  SimaBridge.log(
    "voice_search q=" + q +
    (searchText !== q ? " prepared=" + searchText : "") +
    " source=" + (source || "native") +
    " locale=" + mobilityLocale +
    " catalogReady=" + (typeof MarketSearch !== "undefined" && MarketSearch.isReady && MarketSearch.isReady())
  );

  if (looksLikeServicesCatalogQuery(q) || looksLikeServicesCatalogQuery(searchText)) {
    // Local bathroom catalog only — avoid native services_search overwrite.
    SimaBridge.log("voice_search services local-catalog q=" + q);
    runServicesCatalogSearch(q, { source: source || "voice", voice: true });
    return true;
  }

  if (shouldNotifyUnityMarketSearch()) {
    SimaBridge.send("market_search", {
      text: searchText,
      rawText: q,
      source: source || "voice",
      locale: mobilityLocale,
    });
  }
  if (shouldUseLocalMarketCatalog()) {
    runMarketCatalogSearch(q, { seq: marketSearchSeq, voice: true });
  }
  return true;
}

function buscarDesdeVoz(raw) {
  if (raw == null) return;

  if (typeof raw === "object") {
    const data = (typeof SimaNativePayload !== "undefined" && SimaNativePayload.normalize)
      ? SimaNativePayload.normalize(raw)
      : raw;

    if (typeof data === "string") {
      dispatchVoiceSearch(data, "voice");
      return;
    }

    if (!data || typeof data !== "object") {
      SimaBridge.log("buscarDesdeVoz ignored invalid object payload");
      return;
    }

    const query = (typeof SimaNativePayload !== "undefined" && SimaNativePayload.extractSearchQuery)
      ? SimaNativePayload.extractSearchQuery(data)
      : String(data.query || data.text || data.q || "").trim();

    const knownTypes = {
      market_search: true,
      promotion_search: true,
      services_search: true,
      parking_info: true,
    };

    if (data.type === "market_search") {
      ingestMarketSearchPayload(data);
      return;
    }

    if (data.type && knownTypes[data.type]) {
      renderIncomingPayload(data);
      return;
    }

    if (query) {
      dispatchVoiceSearch(query, data.source || "voice");
      return;
    }

    if (data.type) {
      SimaBridge.log("buscarDesdeVoz unknown type without query type=" + data.type);
      renderIncomingPayload(data);
      return;
    }

    SimaBridge.log(
      "buscarDesdeVoz ignored payload without query/type keys=" +
      Object.keys(data || {}).join(",")
    );
    return;
  }

  let input = String(raw).trim();
  if (!input) return;

  if (input.startsWith("base64:")) {
    try { input = decodeBase64Utf8(input.substring(7)); }
    catch (e) {
      showSearchError("Error al leer los datos de la búsqueda.");
      return;
    }
  }

  if (input.startsWith("{") || input.startsWith("[")) {
    try {
      const parsed = JSON.parse(input);
      buscarDesdeVoz(parsed);
    } catch (e) { showSearchError("Error al mostrar los resultados."); }
    return;
  }

  dispatchVoiceSearch(input, "voice");
}

function renderIncomingPayload(dataJson) {
  if (!dataJson) return;

  const data = (typeof SimaNativePayload !== "undefined" && SimaNativePayload.normalize)
    ? SimaNativePayload.normalize(dataJson)
    : dataJson;

  if (!data.type) {
    const fallbackQuery = (typeof SimaNativePayload !== "undefined" && SimaNativePayload.extractSearchQuery)
      ? SimaNativePayload.extractSearchQuery(data)
      : String(data.query || data.text || data.q || "").trim();
    if (fallbackQuery) {
      dispatchVoiceSearch(fallbackQuery, data.source || "native");
      return;
    }
    SimaBridge.log("renderIncomingPayload ignored: no type/query");
    return;
  }

  switch (data.type) {
    case "market_search": {
      const incomingQuery = String(
        (typeof SimaNativePayload !== "undefined" && SimaNativePayload.extractSearchQuery)
          ? SimaNativePayload.extractSearchQuery(data)
          : (data.query || data.text || data.q || "")
      ).trim();
      const hasResultsArray = Array.isArray(data.results);

      if (incomingQuery) setStoreSearchInputs(incomingQuery);

      // Same guard as ingestMarketSearchPayload: service intents must not become store cards.
      if (incomingQuery && looksLikeServicesCatalogQuery(incomingQuery)) {
        SimaBridge.log(
          "market_search results ignored for services intent q=" + incomingQuery +
          " nativeResults=" + (hasResultsArray ? data.results.length : 0)
        );
        runServicesCatalogSearch(incomingQuery, {
          source: data.source || "native-redirect",
          preferFloor: data.totemFloor || data.floor || getTotemFloorContext() || undefined,
        });
        break;
      }

      if (hasResultsArray && data.results.length > 0) {
        renderMarketResults(Object.assign({}, data, {
          query: incomingQuery || data.query,
          source: data.source || "unity",
        }));
        break;
      }

      if (hasResultsArray && data.results.length === 0) {
        if (localMarketSearchAlreadyResolved(incomingQuery, marketSearchSeq)) {
          SimaBridge.log(
            "market_search unity empty kept local results: " + incomingQuery
          );
          if (incomingQuery) setStoreSearchInputs(incomingQuery);
          break;
        }
        renderMarketResults(Object.assign({}, data, {
          query: incomingQuery || data.query,
          source: data.source || "unity",
        }));
        break;
      }

      if (isMarketSearchUnityOnlyMode()) {
        renderMarketResults(data);
        break;
      }

      if (!incomingQuery) {
        SimaBridge.log("market_search missing query in payload keys=" + Object.keys(data || {}).join(","));
        break;
      }

      if (localMarketSearchAlreadyResolved(incomingQuery, marketSearchSeq)) {
        SimaBridge.log("market_search echo ignored (already resolved locally): " + incomingQuery);
        setStoreSearchInputs(incomingQuery);
        break;
      }

      dispatchVoiceSearch(incomingQuery, data.source || "native");
      break;
    }
    case "promotion_search":
      renderPromotionResults(data);
      break;
    case "services_search": {
      const incomingServiceQuery = String(
        data.query || data.text || data.q || data.search || ""
      ).trim();
      // Totem RN may push legacy bathroom/service payloads; prefer local catalog.
      if (incomingServiceQuery && looksLikeServicesCatalogQuery(incomingServiceQuery)) {
        SimaBridge.log(
          "services_search redirected to local catalog q=" + incomingServiceQuery
        );
        runServicesCatalogSearch(incomingServiceQuery, {
          source: data.source || "native-redirect",
          preferFloor: data.totemFloor || data.floor || getTotemFloorContext() || undefined,
        });
        break;
      }
      if (typeof ServicesCatalog !== "undefined" && ServicesCatalog.loadCatalog) {
        ServicesCatalog.loadCatalog().then(function () {
          enrichServicesSearchPayload(data);
          renderServicesResults(data);
        }).catch(function () {
          renderServicesResults(data);
        });
        break;
      }
      enrichServicesSearchPayload(data);
      renderServicesResults(data);
      break;
    }
    case "parking_info":
      renderParkingInfo(data);
      break;
    default:
      console.warn("Unknown payload type", data.type);
  }
}

function getStoreInitials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function getCencomallSiteOrigin() {
  // Match store-detail.js / store-map: production CDN hosts market photos.
  return String(window.CENCOMALL_SITE_ORIGIN || "https://www.cencomalls.cl").replace(/\/$/, "");
}

function getMarketApiBase() {
  const override = String(window.CENCOMALL_MARKET_API_BASE || "").trim();
  if (override) return override.replace(/\/$/, "");
  return getCencomallSiteOrigin() + "/api/market";
}

function getMarketApiHeaders() {
  const headers = { Accept: "application/json" };
  const token = String(window.CENCOMALL_MARKET_API_TOKEN || window.CENCOMALL_API_TOKEN || "").trim();
  if (token) headers.Authorization = "Bearer " + token;
  return headers;
}

const storeDetailCache = Object.create(null);
let storeDetailRequestSeq = 0;

function mergeStoreDetail(baseStore, detail) {
  if (!baseStore) return detail || null;
  if (!detail || typeof detail !== "object") return baseStore;
  const photos = Array.isArray(detail.market_photos)
    ? detail.market_photos
    : (baseStore.market_photos || []);
  const schedules = Array.isArray(detail.market_schedules) && detail.market_schedules.length
    ? detail.market_schedules
    : (Array.isArray(detail.schedules) && detail.schedules.length
      ? detail.schedules
      : (baseStore.schedules || baseStore.schedule || []));
  const description = String(
    detail.brand_description || detail.description || baseStore.description || ""
  ).trim();
  return Object.assign({}, baseStore, {
    name: baseStore.name || detail.brand_name || detail.market_name || baseStore.brand,
    brand: baseStore.brand || detail.brand_name || baseStore.name,
    local: baseStore.local || String(detail.local || "").trim(),
    id: baseStore.id || detail.id,
    logoUrl: baseStore.logoUrl || detail.brand_logo || "",
    brand_logo: baseStore.brand_logo || detail.brand_logo || "",
    market_photos: photos,
    schedules: schedules,
    schedule: schedules,
    market_schedules: schedules,
    description: description,
    descriptionLocales: Object.assign({}, baseStore.descriptionLocales || {}, {
      es: description || (baseStore.descriptionLocales && baseStore.descriptionLocales.es) || "",
    }),
    website: String(detail.brand_website || baseStore.website || "").trim(),
    keywords: baseStore.keywords || String(detail.keywords || "").trim(),
    category: baseStore.category || String(detail.brand_categories || "").trim(),
    detailLoaded: true,
  });
}

async function fetchStoreDetailById(storeId) {
  const id = String(storeId || "").trim();
  if (!id) return null;
  if (storeDetailCache[id]) return storeDetailCache[id];

  const url = getMarketApiBase() + "/" + encodeURIComponent(id);
  try {
    const res = await fetch(url, {
      cache: "no-cache",
      headers: getMarketApiHeaders(),
    });
    if (!res.ok) {
      SimaBridge.log("market detail HTTP " + res.status + " id=" + id);
      return null;
    }
    const raw = await res.json();
    const detail = (raw && typeof raw === "object" && raw.data && typeof raw.data === "object")
      ? raw.data
      : raw;
    if (!detail || typeof detail !== "object") return null;
    storeDetailCache[id] = detail;
    return detail;
  } catch (e) {
    SimaBridge.log("market detail fetch failed id=" + id + " err=" + (e && e.message ? e.message : e));
    return null;
  }
}

function enrichStoreDetailPanel(store) {
  if (!store) return;
  const id = storeCatalogId(store);
  const reqId = ++storeDetailRequestSeq;

  function applyMerged(next) {
    if (!next || reqId !== storeDetailRequestSeq) return;
    renderStoreDetailPanel(next);
  }

  (async function enrichAsync() {
    let working = store;

    // 1) Slim catalog often already has market_photos — merge before CMS fetch.
    try {
      if (typeof MarketSearch !== "undefined" && MarketSearch.loadCatalog) {
        await MarketSearch.loadCatalog();
        if (reqId !== storeDetailRequestSeq) return;
      }
      if (typeof MarketSearch !== "undefined" && MarketSearch.findExact) {
        const catalogStore = MarketSearch.findExact({
          id: id || store.id,
          local: store.local,
          name: store.name || store.brand,
          floor: store.floor,
        });
        if (catalogStore) {
          working = typeof StoreDetail !== "undefined" && StoreDetail.merge
            ? StoreDetail.merge(store, catalogStore)
            : mergeStoreDetail(store, catalogStore);
          applyMerged(working);
        }
      }
    } catch (e) {
      SimaBridge.log("store catalog merge failed: " + (e && e.message ? e.message : e));
    }

    const hasPhotos = !!(working.market_photos && working.market_photos.length);
    const hasSchedule = !!(
      (working.schedules && working.schedules.length) ||
      (typeof working.schedule === "string" && working.schedule.trim())
    );
    if (working.detailLoaded && hasPhotos && hasSchedule) return;

    // 2) Shared StoreDetail.enrich hits www /api/market/{id} (schedules + photos).
    if (typeof StoreDetail !== "undefined" && StoreDetail.enrich) {
      try {
        const cmsDetail = await StoreDetail.enrich(working);
        if (!cmsDetail || reqId !== storeDetailRequestSeq) return;
        applyMerged(cmsDetail);
      } catch (e) {
        SimaBridge.log("StoreDetail.enrich failed: " + (e && e.message ? e.message : e));
      }
      return;
    }

    if (!id) return;
    const detail = await fetchStoreDetailById(id);
    if (!detail || reqId !== storeDetailRequestSeq) return;
    applyMerged(mergeStoreDetail(working, detail));
  })();
}

function resolveMediaUrl(url) {
  if (!url) return "";
  const u = String(url).trim();
  if (/^https?:\/\//i.test(u)) return u;
  const origin = getCencomallSiteOrigin();
  return u.startsWith("/") ? origin + u : origin + "/" + u;
}

function resolveStoreLogoUrl(result) {
  if (!result) return "";
  const raw = String(
    result.logoUrl || result.LogoUrl || result.logo || result.brand_logo || ""
  ).trim();
  return resolveMediaUrl(raw);
}

function resolveStorePhotos(result) {
  if (!result) return [];
  const raw = result.market_photos || result.marketPhotos || result["market-photos"];
  if (Array.isArray(raw)) {
    return raw.map((url) => String(url || "").trim()).filter(Boolean);
  }
  if (typeof raw === "string" && raw.trim()) return [raw.trim()];
  return [];
}

function resolveStorePhotoUrl(result) {
  const photos = resolveStorePhotos(result);
  return photos.length ? resolveMediaUrl(photos[0]) : "";
}

function onStoreDetailMediaError(img) {
  const fallbackLogo = img.getAttribute("data-fallback-logo") || "";
  if (fallbackLogo && img.classList.contains("store-detail-photo")) {
    img.classList.remove("store-detail-photo");
    img.classList.add("store-logo", "store-detail-logo");
    img.src = fallbackLogo;
    img.removeAttribute("data-fallback-logo");
    img.onerror = function () { onStoreLogoError(img); };
    return;
  }
  onStoreLogoError(img);
}

function onStoreLogoError(img) {
  const initials = img.getAttribute("data-initials") || "?";
  const hadDetail = img.classList.contains("store-detail-logo");
  const isAz = img.classList.contains("cm-az-store-icon");
  const div = document.createElement("div");
  if (isAz) {
    div.className = "cm-az-store-icon cm-az-store-initials";
  } else {
    div.className = hadDetail ? "store-initials store-detail-logo" : "store-initials";
  }
  div.textContent = initials;
  img.replaceWith(div);
}

function renderStoreAvatar(result, detail) {
  const name = result.name || result.brand || "Tienda";
  const initials = getStoreInitials(name);
  const logoUrl = resolveStoreLogoUrl(result);
  const extraClass = detail ? " store-detail-logo" : "";
  if (!logoUrl) {
    return `<div class="store-initials${extraClass}">${escapeHtml(initials)}</div>`;
  }
  return `<img class="store-logo${extraClass}" src="${escapeHtml(logoUrl)}" alt="" loading="lazy" data-initials="${escapeHtml(initials)}" onerror="onStoreLogoError(this)" />`;
}

function renderAZStoreIcon(store) {
  const name = String((store && (store.brand || store.name)) || "Tienda");
  const initials = getStoreInitials(name);
  const logoUrl = resolveStoreLogoUrl(store);
  if (!logoUrl) {
    return `<div class="cm-az-store-icon cm-az-store-initials" aria-hidden="true">${escapeHtml(initials)}</div>`;
  }
  return `<img class="cm-az-store-icon" src="${escapeHtml(logoUrl)}" alt="" loading="lazy" aria-hidden="true" data-initials="${escapeHtml(initials)}" onerror="onStoreLogoError(this)" />`;
}

function renderStoreDetailMedia(store) {
  const name = store.name || store.brand || "Tienda";
  const initials = getStoreInitials(name);
  const photoUrl = resolveStorePhotoUrl(store);
  const logoUrl = resolveStoreLogoUrl(store);
  const mediaUrl = photoUrl || logoUrl;

  if (!mediaUrl) {
    return `<div class="store-initials store-detail-logo">${escapeHtml(initials)}</div>`;
  }

  if (photoUrl) {
    return `<img class="store-detail-photo" src="${escapeHtml(photoUrl)}" alt="" loading="eager" data-initials="${escapeHtml(initials)}" data-fallback-logo="${escapeHtml(logoUrl)}" onerror="onStoreDetailMediaError(this)" />`;
  }

  return renderStoreAvatar(store, true);
}

function formatNivel(floor) {
  if (!floor) return "—";
  const f = String(floor).trim();
  if (f.toUpperCase() === "ALL") return t("allLevels");
  if (/^pb$/i.test(f) || /planta baja/i.test(f)) return t("gf");
  const m = f.match(/(\d+)/);
  if (m) return t("level") + " " + m[1];
  return f;
}

function getMapButtonLabelForFloor(floor) {
  const nivel = formatNivel(floor);
  if (!nivel || nivel === "—") return t("viewMap");
  return `${t("viewMap")} · ${nivel}`;
}

function formatServiceFloors(floors) {
  if (!floors || !floors.length) return "";
  if (floors.includes("ALL")) return t("allLevels");
  const labels = floors.map((f) => formatNivel(f)).filter(Boolean);
  if (labels.length <= 2) return labels.join(" · ");
  // Compact range for multi-floor elevator banks: PB–Nivel 5
  return labels[0] + "–" + labels[labels.length - 1];
}

function getServiceKind(svc) {
  const type = String((svc && svc.type) || "").toLowerCase();
  if (type === "elevator") return "elevator";
  if (type === "customer_service" || type === "customer-service") return "customer_service";
  if (type === "cowork") return "cowork";
  if (type === "bathroom") {
    const n = String((svc && svc.name) || "").toLowerCase();
    if (n.includes("niños") || n.includes("ninos") || n.includes("mudador")) return "kids";
    return "bathroom";
  }
  const n = String((svc && (typeof svc === "string" ? svc : svc.name)) || "").toLowerCase();
  if (n.includes("ascensor") || n.includes("elevador") || n.includes("elevator")) return "elevator";
  if (n.includes("atención al cliente") || n.includes("atencion al cliente") || n.includes("servicio al cliente") || n.includes("customer service")) {
    return "customer_service";
  }
  if (n.includes("cowork") || n.includes("co work") || n.includes("co-work")) return "cowork";
  if (n.includes("niños") || n.includes("ninos") || n.includes("mudador")) return "kids";
  if (n.includes("baño") || n.includes("bano") || n.includes("wc")) return "bathroom";
  return "";
}

function serviceKindIcon(kind) {
  if (kind === "elevator") return '<img src="../shared/category-icons/elevator.svg" alt="" class="service-card-icon-svg" loading="lazy" />';
  if (kind === "kids") return "👶";
  if (kind === "bathroom") return '<img src="../shared/category-icons/restroom.svg" alt="" class="service-card-icon-svg" loading="lazy" />';
  if (kind === "customer_service") return '<img src="../shared/category-icons/customer_service.svg" alt="" class="service-card-icon-svg" loading="lazy" />';
  if (kind === "cowork") return '<img src="../shared/category-icons/cowork.svg" alt="" class="service-card-icon-svg" loading="lazy" />';
  return "📍";
}

function firstCategory(category) {
  if (!category) return "";
  return String(category).split(",")[0].trim();
}

function truncate(text, max) {
  if (!text) return "";
  const clean = String(text).trim();
  return clean.length <= max ? clean : clean.substring(0, max - 1) + "…";
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function summarizeFloors(locations) {
  if (!locations || !locations.length) return "";
  return getSortedFloorLabelsFromLocations(locations).join(" · ");
}

function countDistinctFloors(locations) {
  if (!locations || !locations.length) return 0;
  const floorKeys = locations
    .map((loc) => formatNivel(loc && loc.floor))
    .map((f) => String(f || "").trim().toLowerCase())
    .filter(Boolean);
  return new Set(floorKeys).size;
}

function sanitizeStoreDisplayName(name) {
  let clean = String(name || "").trim();
  if (!clean) return "";

  // Common noisy suffixes coming from some navigation payloads.
  clean = clean.replace(/\s*-\s*(nivel(?:es)?|level(?:s)?)\s*[\d,\s]+\s*-\s*mall\s*cc\s*$/i, "");
  clean = clean.replace(/\s*-\s*(nivel(?:es)?|level(?:s)?)\s*[\d,\s]+$/i, "");
  clean = clean.replace(/\s*-\s*mall\s*cc\s*$/i, "");
  clean = clean.replace(/\s*-\s*mallcc\s*$/i, "");

  return clean.trim();
}

function formatStoreScheduleText(store) {
  if (!store) return "";

  const direct = store.schedule;
  if (typeof direct === "string" && direct.trim()) {
    return direct.trim();
  }

  let list = [];
  if (Array.isArray(store.schedules)) list = store.schedules;
  else if (Array.isArray(store.schedule)) list = store.schedule;
  else if (Array.isArray(store.market_schedules)) list = store.market_schedules;

  if (!list.length) return "";

  const parts = list.map((item) => {
    if (typeof item === "string") return item.trim();
    if (!item || typeof item !== "object") return "";
    const days = String(item.dias_txhorarios || item.days || item.day || "").trim();
    const hours = String(item.horas_txhorarios || item.hours || item.time || "").trim();
    if (days && hours) return `${days}: ${hours}`;
    return days || hours;
  }).filter(Boolean);

  return parts.join(" · ");
}

function getFloorSortMeta(floor) {
  const label = formatNivel(floor);
  const raw = String(floor || "").trim();

  if (!label || label === "—") {
    return { label: "", hasNumber: false, order: Number.POSITIVE_INFINITY };
  }

  if (/^pb$/i.test(raw) || /planta baja/i.test(raw)) {
    return { label: label, hasNumber: true, order: 0 };
  }

  const rawMatch = raw.match(/-?\d+/);
  const labelMatch = String(label).match(/-?\d+/);
  const numberText = rawMatch ? rawMatch[0] : (labelMatch ? labelMatch[0] : "");
  const order = numberText ? Number(numberText) : Number.POSITIVE_INFINITY;
  const hasNumber = isFinite(order);

  return { label: label, hasNumber: hasNumber, order: hasNumber ? order : Number.POSITIVE_INFINITY };
}

function compareFloorMeta(a, b) {
  if (a.hasNumber && b.hasNumber && a.order !== b.order) return a.order - b.order;
  if (a.hasNumber !== b.hasNumber) return a.hasNumber ? -1 : 1;
  return String(a.label || "").localeCompare(String(b.label || ""), "es");
}

function parseLocalFloorLevels(local) {
  const match = String(local || "").trim().match(/^CC_([^_]+)_/i);
  if (!match) return [];
  const segment = String(match[1] || "").trim().toUpperCase();
  if (!segment) return [];
  if (segment === "PB") return [0];
  return segment.split(",").map((part) => {
    const token = String(part || "").trim().toUpperCase();
    const nMatch = token.match(/^N(\d+)$/);
    if (nMatch) return Number(nMatch[1]);
    if (/^\d+$/.test(token)) return Number(token);
    return null;
  }).filter((n) => n != null);
}

function localSpecificityScore(local, floorMeta) {
  const floors = parseLocalFloorLevels(local);
  let score = 0;
  if (floors.length === 1) score += 200;
  if (floors.length > 1) score -= 40;
  if (floorMeta.hasNumber) {
    if (floors.length === 1 && floors[0] === floorMeta.order) score += 300;
    if (floors.indexOf(floorMeta.order) >= 0) score += 80;
    const exactToken = `N${floorMeta.order}_`;
    const localUpper = String(local || "").toUpperCase();
    if (localUpper.indexOf(`_${exactToken}`) >= 0 || localUpper.indexOf(`_${exactToken.replace("_", "")}`) >= 0) {
      score += 120;
    }
    if (new RegExp(`^CC_N${floorMeta.order}_`, "i").test(String(local || ""))) score += 180;
  }
  return score;
}

function locationMatchesFloor(loc, floorMeta) {
  if (!loc) return false;
  const locMeta = getFloorSortMeta(loc.floor);
  if (floorMeta.label && locMeta.label) {
    return floorMeta.label.toLowerCase() === locMeta.label.toLowerCase();
  }
  if (floorMeta.hasNumber && locMeta.hasNumber) {
    return floorMeta.order === locMeta.order;
  }
  return false;
}

function pickBestLocationForFloor(locations, referenceLoc) {
  const floorMeta = getFloorSortMeta(referenceLoc && referenceLoc.floor);
  let best = null;
  (locations || []).forEach((loc, locIdx) => {
    if (!locationMatchesFloor(loc, floorMeta)) return;
    const score = localSpecificityScore(loc.local, floorMeta);
    if (!best || score > best.score) {
      best = { loc: loc, locIdx: locIdx, score: score };
    }
  });
  return best;
}

function isMultiFloorLocal(local) {
  return parseLocalFloorLevels(local).length > 1;
}

function getDisplayLocationCount(locations) {
  return buildUniqueFloorRows(locations || []).length;
}

function buildUniqueFloorRows(locations) {
  const rows = [];

  (locations || []).forEach((loc, locIdx) => {
    const floorLabel = formatNivel(loc && loc.floor);
    const floorKey = String(floorLabel || "").trim().toLowerCase();
    if (!floorKey || floorKey === "—") return;

    const available = loc && loc.available !== false;
    const candidate = { loc: loc, locIdx: locIdx, floorLabel: floorLabel, available: available };
    const floorMeta = getFloorSortMeta(loc && loc.floor);
    const localCode = String(loc && loc.local || "").trim().toUpperCase();
    if (!localCode) {
      rows.push(candidate);
      return;
    }

    const duplicateIdx = rows.findIndex(function (row) {
      return row.floorLabel.toLowerCase() === floorKey
        && String(row.loc && row.loc.local || "").trim().toUpperCase() === localCode;
    });
    if (duplicateIdx >= 0) return;

    const sameFloorIdx = rows.findIndex(function (row) {
      return row.floorLabel.toLowerCase() === floorKey;
    });
    if (sameFloorIdx < 0) {
      rows.push(candidate);
      return;
    }

    const prev = rows[sameFloorIdx];
    const prevMulti = isMultiFloorLocal(prev.loc && prev.loc.local);
    const nextMulti = isMultiFloorLocal(loc && loc.local);

    if (prevMulti || nextMulti) {
      const prevScore = localSpecificityScore(prev.loc && prev.loc.local, floorMeta);
      const nextScore = localSpecificityScore(loc && loc.local, floorMeta);
      if (nextScore > prevScore || (available && !prev.available)) {
        rows[sameFloorIdx] = candidate;
      }
      return;
    }

    // Distinct single-floor stores on the same level (e.g. two Claro on PB).
    rows.push(candidate);
  });

  return rows.length
    ? rows
    : (locations || []).map(function (loc, locIdx) {
        return {
          loc: loc,
          locIdx: locIdx,
          floorLabel: formatNivel(loc && loc.floor),
          available: loc && loc.available !== false,
        };
      });
}

function getSortedFloorLabelsFromLocations(locations) {
  if (!locations || !locations.length) return [];

  const seen = {};
  const metas = [];

  locations.forEach((loc) => {
    const meta = getFloorSortMeta(loc && loc.floor);
    const key = String(meta.label || "").trim().toLowerCase();
    if (!key || key === "—" || seen[key]) return;
    seen[key] = true;
    metas.push(meta);
  });

  metas.sort(compareFloorMeta);
  return metas.map((m) => m.label);
}

function resolveStore(groupIndex, locationIndex) {
  const result = lastMarketPayload?.results?.[groupIndex];
  if (!result) return null;

  const base = {
    id: result.id,
    name: result.name,
    floor: result.floor,
    category: result.category,
    local: result.local,
    schedule: result.schedule,
    schedules: result.schedules || result.market_schedules,
    market_schedules: result.market_schedules || result.schedules,
    brand: result.brand,
    mall: result.mall,
    logoUrl: result.logoUrl,
    brand_logo: result.brand_logo,
    market_photos: result.market_photos,
    keywords: result.keywords,
    description: result.description,
    available: result.available !== false
  };

  if (
    locationIndex != null
    && result.isGroup
    && result.locations
    && result.locations[locationIndex]
  ) {
    const loc = result.locations[locationIndex];
    return {
      ...base,
      id: loc.id || base.id,
      name: loc.name || base.name,
      floor: loc.floor || base.floor,
      category: loc.category || base.category,
      local: loc.local || base.local,
      schedule: loc.schedule || base.schedule,
      schedules: Array.isArray(loc.schedules) && loc.schedules.length

      market_photos: loc.market_photos || base.market_photos,
      available: loc.available !== false
    };
  }

  return base;
}

function findStoreInMarketPayload(localOrId) {
  const key = String(localOrId || "").trim().toLowerCase();
  if (!key || !lastMarketPayload?.results?.length) return null;

  for (let idx = 0; idx < lastMarketPayload.results.length; idx++) {
    const result = lastMarketPayload.results[idx];
    if (
      String(result.local || "").trim().toLowerCase() === key
      || String(result.id || "").trim().toLowerCase() === key
    ) {
      return resolveStore(idx);
    }
    if (result.locations?.length) {
      for (let locIdx = 0; locIdx < result.locations.length; locIdx++) {
        const loc = result.locations[locIdx];
        if (
          String(loc.local || "").trim().toLowerCase() === key
          || String(loc.id || "").trim().toLowerCase() === key
        ) {
          return resolveStore(idx, locIdx);
        }
      }
    }
  }
  return null;
}

function shortenSpeechText(text, maxWords, maxChars) {
  const raw = String(text || "").trim();
  if (!raw) return "";

  const sentence = raw.split(/[.!?]\s+/)[0].trim() || raw;
  const words = sentence.split(/\s+/).filter(Boolean);
  const wordLimit = Math.max(1, Number(maxWords) || 12);
  const charLimit = Math.max(20, Number(maxChars) || 120);
  const shortened = words.slice(0, wordLimit).join(" ");
  const clipped = shortened.length > charLimit
    ? shortened.slice(0, charLimit).replace(/\s+\S*$/, "").trim()
    : shortened;

  if (clipped && clipped.length < sentence.length) {
    return clipped.replace(/[,:;]+$/, "").trim();
  }
  return sentence.length > charLimit
    ? sentence.slice(0, charLimit).replace(/\s+\S*$/, "").trim()
    : sentence;
}

  if (result.isGroup && result.locations && result.locations.length > 1) {
    const distinctFloors = countDistinctFloors(result.locations);
    if (distinctFloors <= 1) {
      const primaryIndex = result.locations.findIndex((loc) => loc && loc.available !== false);
      const fallbackIdx = primaryIndex >= 0 ? primaryIndex : 0;
      const bestSingle = pickBestLocationForFloor(result.locations, result.locations[fallbackIdx]) || {
        loc: result.locations[fallbackIdx] || {},
        locIdx: fallbackIdx,
      };
      const locIdx = bestSingle.locIdx;
      const loc = bestSingle.loc || {};
      const available = loc.available !== false;
      const btn = available
        ? `<button class="btn-ver-mapa" type="button" onclick="event.stopPropagation(); openStoreMap(${idx}, ${locIdx})">${escapeHtml(getMapButtonLabelForFloor(loc.floor))}</button>`
        : `<button class="btn-remodelacion" disabled>${escapeHtml(t("renovation"))}</button>`;
      const category = firstCategoryLocalized(loc.category || result.category);
      const categoryBadge = category
        ? `<span class="store-badge" title="${escapeHtml(localizeCategoryField(loc.category || result.category || ""))}">${escapeHtml(truncate(category, 14))}</span>`
        : "";
      const floor = `<span class="store-badge store-badge-floor">${escapeHtml(formatNivel(loc.floor || result.floor))}</span>`;

            <div class="store-meta">${categoryBadge}${floor}</div>

          ${btn}

    }

    const displayName = result.name || result.brand || "Tienda";
    const category = firstCategoryLocalized(result.category);
    const categoryBadge = category
      ? `<span class="store-badge" title="${escapeHtml(localizeCategoryField(result.category))}">${escapeHtml(truncate(category, 14))}</span>`
      : "";
    const rowsSource = buildUniqueFloorRows(result.locations);
    const floorsSummary = summarizeFloors(rowsSource.map(function (row) { return row.loc; }));
    const displayLocationCount = rowsSource.length;

    rowsSource.sort((a, b) => compareFloorMeta(getFloorSortMeta(a && a.loc && a.loc.floor), getFloorSortMeta(b && b.loc && b.loc.floor)));

    const subRows = rowsSource.map((row) => {
      const loc = row.loc || {};

        ? `<button class="btn-ver-mapa-sm" type="button" onclick="openStoreMap(${idx}, ${locIdx})">${escapeHtml(mapLabel)}</button>`
        : `<button class="btn-ver-mapa-sm" type="button" disabled style="background:#B7B0C2">${escapeHtml(t("renovation"))} · ${escapeHtml(formatNivel(loc.floor))}</button>`;

      return `
        <div class="store-group-row map-only">
          ${mapBtn}
        </div>`;
    }).join("");

    return `
      <article class="store-card store-card-group fade-in">
        <div class="store-card-top">
          ${renderStoreAvatar(result)}
          <div class="store-name">${escapeHtml(displayName)}</div>
          <div class="store-meta">
            ${categoryBadge}

          <div class="cm-empty-copy">${escapeHtml(t("parkingUnavailable"))}</div>

    <div class="parking-item">

      </div>

  document.getElementById("resultado").innerHTML = `
    <div class="cm-panel fade-in">

      <div class="parking-accordion">${accordion}</div>

}

function toggleParkingItem(idx) {
  const body = document.getElementById("park-body-" + idx);
  if (body) body.classList.toggle("hidden");

function hideWelcome() {
  const welcome = document.getElementById("welcome-hint");
  if (welcome) welcome.classList.add("hidden");

function renderMarketResults(payload) {
  const results = payload.results || [];
  const query = String(payload.query || payload.searchQuery || "").trim();

  // Absolute last-mile guard: never paint store empty/cards for service intents.
  // Catches late native empty market_search that would overwrite a correct services UI.
  if (query && looksLikeServicesCatalogQuery(query)) {
    SimaBridge.log(
      "renderMarketResults blocked for services intent q=" + query +
      " results=" + results.length +
      " source=" + (payload.source || "-")
    );
    runServicesCatalogSearch(query, {
      source: payload.source || "market-render-guard",
      preferFloor: payload.totemFloor || payload.floor || getTotemFloorContext() || undefined,
    });
    return;
  }

  clearSearchBootLoading();
  lastMarketPayload = payload;
  hideWelcome();

  // A-Z lives in the categories panel with letter separators; restore that UI.
  if (payload.resultType === "az") {
    cachedAZStoreResults = results.slice(0);
    preferredCategoriesTab = "az";
    openStoreCategories();
    return;
  }

  if (query) {
    setStoreSearchInputs(query);
    const inputEl = document.getElementById("storeSearchInput");
    if (inputEl && inputEl.value !== query) inputEl.value = query;
    const inlineEl = document.getElementById("storeSearchInlineInput");
    if (inlineEl && inlineEl.value !== query) inlineEl.value = query;
  }

  if (payload.message && results.length === 0) {
    document.getElementById("resultado").innerHTML = `
      <div class="cm-panel fade-in">
        <div class="cm-empty">
          <div class="cm-empty-title">${escapeHtml(query || t("search"))}</div>
          <div class="cm-empty-copy">${escapeHtml(payload.message)}</div>
          ${renderResultsSearchBar(query)}
        </div>
      </div>`;
    SimaBridge.speak(payload.message);
    return;
  }

  if (results.length === 0) {
    const backLink = payload.resultType === "category" || payload.resultType === "az"
      ? `<button class="cm-back-link" type="button" onclick="openStoreCategories()">${escapeHtml(t("backCategories"))}</button>`
      : "";
    document.getElementById("resultado").innerHTML = `
      <div class="cm-panel fade-in">
        ${backLink ? `<div class="cm-results-sticky">${backLink}</div>` : ""}
        <div class="cm-empty">
          <div class="cm-empty-title">${escapeHtml(t("noResults"))}</div>
          <div class="cm-empty-copy">${escapeHtml(t("storesNotFound"))} "${escapeHtml(query)}". ${escapeHtml(t("searchTryAgain"))}</div>
          ${renderResultsSearchBar(query)}
        </div>
      </div>`;
    SimaBridge.speak(
      t(
        payload.resultKind === "restaurants" || isFoodMarketQuery(query)
          ? "restaurantsFoundNone"
          : "storesFoundNone"
      ) +
        " " +
        query
    );
    return;
  }

  const cardsHtml = results.map((r, idx) => renderStoreCard(r, idx)).join("");
  const backLink = payload.resultType === "category" || payload.resultType === "az"
    ? `<button class="cm-back-link" type="button" onclick="openStoreCategories()">${escapeHtml(t("backCategories"))}</button>`
    : "";

  document.getElementById("resultado").innerHTML = `
    <div class="cm-panel fade-in">
      <div class="cm-results-sticky">
        ${backLink}
        <div class="cm-results-head">
          <h2 class="cm-results-title">${escapeHtml(t("results"))}</h2>
          <div class="cm-results-actions">
            ${renderMarketResultsActions()}
            <span class="cm-results-count">${results.length}</span>
          </div>
        </div>
        <p class="cm-results-query">${renderMarketResultsLabel(payload)}</p>
        ${renderResultsSearchBar(query)}
      </div>
      <div class="store-grid">${cardsHtml}</div>
    </div>`;
  preloadMapVxBaseMap();
  if (payload.source !== "unity" && payload.resultType !== "az") {
    speakMarketResultsFound(payload);
  }
}

function setMapStatus(text, isError) {

  if (!status) return;
  if (!text) {
    status.classList.add("hidden");
    status.textContent = "";
    return;

function logMap(level, message, data) {
  const prefix = "[mobility/map]";
  const line = data !== undefined ? `${prefix} ${message} ${JSON.stringify(data)}` : `${prefix} ${message}`;
  if (level === "error") console.error(line);
  else if (level === "warn") console.warn(line);
  else console.log(line);
  if (typeof SimaBridge !== "undefined") {
    SimaBridge.send("mapvx_log", {
      level: level || "info",
      message: prefix + " " + message,
      data: data ? String(JSON.stringify(data)).slice(0, 500) : ""
    });
  }
}

function logMapVxConfig(context) {
  const cfg = window.MAPVX_CONFIG || {};
  const summary = typeof MapVxBridge !== "undefined" && MapVxBridge.configSummary
    ? MapVxBridge.configSummary(cfg)
    : {
        hasApiKey: !!(cfg.apiKey && cfg.apiKey.length),
        apiKeyLen: cfg.apiKey ? cfg.apiKey.length : 0,
        parentPlace: cfg.parentPlace || null,
        institutionId: cfg.institutionId || null
      };
  logMap("info", context + " MAPVX_CONFIG", summary);
  logMap("info", context + " sdkLoaded", {
    MapVX: typeof MapVX !== "undefined",
    MapVxBridge: typeof MapVxBridge !== "undefined",
    configured: typeof MapVxBridge !== "undefined" && MapVxBridge.isConfigured()
  });
}

function applyMapVxDefaultsFromMapPage() {
  if (!window.MAPVX_CONFIG) window.MAPVX_CONFIG = {};
  const cfg = window.MAPVX_CONFIG;

  // Keep mobility map behavior aligned with map/index defaults while
  // respecting Unity-injected values (e.g. totemPlaceId for route mode).
  // Disabled 2026-08-06: MapVX confirmed these anchor logo/round-icon
  // overlays are ours (built in mapvx-bridge.js), not part of their
  // rendering — off until we settle with them whether/how to keep it.
  if (!cfg.showStoreLabels) cfg.showStoreLabels = "none";
  if (cfg.storeLabelMax == null) cfg.storeLabelMax = 0;
  if (cfg.storeLabelZoomDelta == null || !isFinite(Number(cfg.storeLabelZoomDelta))) {
    cfg.storeLabelZoomDelta = 1.2;
  }
  if (!cfg.lang && mobilityLocale) cfg.lang = mobilityLocale;
  if (cfg.totemPlaceId == null) cfg.totemPlaceId = "";
  const totemFloor = getTotemFloorContext();
  if (totemFloor && !cfg.totemFloor) cfg.totemFloor = totemFloor;

  if (!window.MAPVX_ASSETS_BASE) {
    window.MAPVX_ASSETS_BASE = "../shared/mapvx/";
  }

  return cfg;
}

function isMapVxConfigured() {
  return typeof MapVxBridge !== "undefined" && MapVxBridge.isConfigured && MapVxBridge.isConfigured();
}

async function warmupMapVxInBackground() {
  if (mapVxWarmupPromise || !isMapVxConfigured()) return mapVxWarmupPromise;

  const cfg = applyMapVxDefaultsFromMapPage();
  if (!cfg.apiKey || !cfg.parentPlace || !cfg.institutionId) return null;

  mapVxWarmupPromise = MapVxBridge.ensureReady(cfg)
    .then(function () {
      if (typeof MapVxBridge.prefetchMapCatalog === "function") {
        return MapVxBridge.prefetchMapCatalog(cfg).catch(function () { return false; });
      }
      return true;
    })
    .then(() => {
      SimaBridge.log("mobility map warmup completed");
      return true;
    })
    .catch((e) => {
      console.warn("MapVx warmup failed", e);
      SimaBridge.log("mobility map warmup failed");
      return false;
    });

  return mapVxWarmupPromise;
}

async function preloadMapVxBaseMap() {
  if (mapVxPreloadPromise) return mapVxPreloadPromise;
  if (!isMapVxConfigured()) return null;
  if (typeof MapVxBridge !== "undefined" && MapVxBridge.hasLiveMap && MapVxBridge.hasLiveMap()) {
    mapVxPreloadPromise = Promise.resolve(true);
    return mapVxPreloadPromise;
  }

  const cfg = applyMapVxDefaultsFromMapPage();
  if (!cfg.apiKey || !cfg.parentPlace || !cfg.institutionId) return null;

  const mapView = document.getElementById("map-view");
  const container = document.getElementById("mapvx-container");
  if (!mapView || !container || !mapView.classList.contains("hidden")) return null;

  mapView.classList.add("preload-mount");
  container.classList.remove("hidden");

  mapVxPreloadPromise = MapVxBridge.ensureMap(container, cfg)
    .then(() => {
      SimaBridge.log("mobility map base preload completed");
      return true;
    })
    .catch((e) => {
      console.warn("MapVx base preload failed", e);
      SimaBridge.log("mobility map base preload failed: " + (e.message || e));
      mapVxPreloadPromise = null;
      return false;
    })
    .finally(() => {
      if (mapView.classList.contains("hidden")) {
        mapView.classList.remove("preload-mount");
        container.classList.add("hidden");
      }
    });

  return mapVxPreloadPromise;
}

let mapVxWcWarmupPromise = null;

async function warmupMapVxWcInBackground() {
  if (mapVxWcWarmupPromise) return mapVxWcWarmupPromise;
  if (preferredMobilityMapEngine() === "legacy") return null;
  if (typeof MapVxWcRuntime === "undefined" || !MapVxWcRuntime.isAvailable || !MapVxWcRuntime.isAvailable()) {
    return null;
  }
  applyMapVxDefaultsFromMapPage();
  const cfg = (MapVxWcRuntime.readConfig && MapVxWcRuntime.readConfig()) || window.MAPVX_CONFIG || {};
  if (!cfg.apiKey) return null;

  initMobilityWcRuntime();
  mapVxWcWarmupPromise = MapVxWcRuntime.warmup({ timeoutMs: 12000 })
    .then(function (warm) {
      SimaBridge.log("mobility wc warmup " + JSON.stringify(warm || {}));
      return !!(warm && warm.warm);
    })
    .catch(function (e) {
      console.warn("MapVx WC warmup failed", e);
      SimaBridge.log("mobility wc warmup failed");
      mapVxWcWarmupPromise = null;
      return false;
    });
  return mapVxWcWarmupPromise;
}

function setMapLoadingState(loading) {
  const wrap = document.querySelector(".map-embed-wrap");
  const container = document.getElementById("mapvx-container");
  const placeholder = document.getElementById("map-placeholder");
  const spinner = document.getElementById("map-loading-circle");
  if (!wrap || !container || !placeholder || !spinner) return;

  wrap.classList.toggle("is-loading", !!loading);
  wrap.classList.toggle("is-ready", !loading);
  if (loading) {
    placeholder.classList.add("hidden");
    spinner.classList.remove("hidden");
    container.style.opacity = "0";
  } else {
    container.style.opacity = "1";
    placeholder.classList.add("hidden");
    spinner.classList.add("hidden");
  }
}

function getMetersPerPixel(zoom, lat) {
  return 156543.03392 * Math.cos((lat || 0) * Math.PI / 180) / Math.pow(2, zoom || 0);
}

function formatVisibleWidthMeters(meters) {
  if (!isFinite(meters) || meters <= 0) return "";
  if (meters < 1000) return Math.round(meters) + " m";
  return (meters / 1000).toFixed(meters >= 10000 ? 0 : 1) + " km";
}

let mapZoomMeterTimer = null;

function updateMapZoomMeter() {
  const meter = document.getElementById("map-zoom-meter");
  const wrap = document.querySelector(".map-embed-wrap");
  const mapView = document.getElementById("map-view");
  if (!meter || !wrap || !mapView || mapView.classList.contains("hidden")) return;
  // WC map has no MapVxBridge view-state — hide the legacy zoom chip.
  if (mobilityActiveMapEngine === "wc") {
    meter.classList.add("hidden");
    return;
  }
  if (typeof MapVxBridge === "undefined" || !MapVxBridge.getMapViewState) {
    meter.classList.add("hidden");
    return;
  }
  const state = MapVxBridge.getMapViewState();
  if (!state || state.zoom == null) {
    meter.classList.add("hidden");
    return;
  }
  const lat = state.center && state.center.lat != null ? state.center.lat : 0;
  const visibleMeters = getMetersPerPixel(state.zoom, lat) * (wrap.clientWidth || 0);
  meter.textContent = String(t("zoomMeterLabel") || "")
    .replace("{zoom}", state.zoom.toFixed(1))
    .replace("{distance}", formatVisibleWidthMeters(visibleMeters));
  meter.classList.remove("hidden");
}

function startMapZoomMeter() {
  stopMapZoomMeter();
  updateMapZoomMeter();
  mapZoomMeterTimer = window.setInterval(updateMapZoomMeter, 300);
}

function stopMapZoomMeter() {
  if (mapZoomMeterTimer) {
    window.clearInterval(mapZoomMeterTimer);
    mapZoomMeterTimer = null;
  }
}

function attachMapZoomLabelSwitcher(result) {
  // Label expansion on zoom is handled by MapVxBridge.attachZoomLabelSwitcher.
}

function useMapVxSdk() {
  const ok = typeof MapVxBridge !== "undefined" && MapVxBridge.isConfigured();
  if (!ok) {
    logMap("warn", "useMapVxSdk=false", {
      bridge: typeof MapVxBridge !== "undefined",
      configured: typeof MapVxBridge !== "undefined" ? MapVxBridge.isConfigured() : false,
      mapUrl: MAP_SERVICE_BASE_URL || window.MALL_MAP_BASE_URL || ""
    });
  }
  return ok;
}

function resetMapControls() {
  const floorBadge = document.getElementById("map-current-floor");
  const routeBtn = document.getElementById("map-route-btn");
  if (floorBadge) {
    floorBadge.classList.add("hidden");
    floorBadge.textContent = "";
  }
  if (routeBtn) {
    routeBtn.classList.add("hidden");
    routeBtn.disabled = false;
    routeBtn.classList.remove("disabled");
    routeBtn.textContent = t("viewRoute");
  }
}

function updateMapRouteButton(result) {
  const btn = document.getElementById("map-route-btn");
  if (!btn) return;
  const canRoute = (mobilityActiveMapEngine === "wc"
      && typeof MapVxWcRuntime !== "undefined"
      && MapVxWcRuntime.hasRouteOrigin
      && MapVxWcRuntime.hasRouteOrigin())
    || (typeof MapVxBridge !== "undefined"
      && MapVxBridge.hasRouteOrigin
      && MapVxBridge.hasRouteOrigin());
  btn.classList.remove("hidden");
  if (!canRoute) {
    btn.textContent = t("routeNeedsTotem");
    btn.classList.add("disabled");
    btn.disabled = true;
    return;
  }
  btn.disabled = false;
  btn.classList.remove("disabled");
  const active = !!(result && (result.routeActive || result.routeStarted)) || mobilityMapRouteActive;
  btn.textContent = active ? t("clearRoute") : t("viewRoute");
}

function renderMapFloorBar(activeFloorKey) {
  const badge = document.getElementById("map-current-floor");
  if (!badge || typeof MapVxBridge === "undefined" || !MapVxBridge.getMapFloors) return;
  const floors = MapVxBridge.getMapFloors() || [];
  if (!floors.length) {
    badge.classList.add("hidden");
    badge.textContent = "";
    return;
  }
  const active = floors.find(function (f) { return f.key === activeFloorKey; }) || floors[0];
  badge.textContent = active ? active.label : "";
  badge.classList.toggle("hidden", !active || !active.label);
}

async function onMapFloorSelect(floorKey) {
  if (!floorKey || typeof MapVxBridge === "undefined" || !MapVxBridge.switchFloor) return;
  try {
    await MapVxBridge.switchFloor(floorKey);
    renderMapFloorBar(floorKey);
  } catch (e) {
    logMap("error", "onMapFloorSelect failed", { floorKey, message: e.message || String(e) });
  }
}

async function onMapRouteToggle() {
  const btn = document.getElementById("map-route-btn");
  if (!btn || btn.disabled) return;
  try {
    if (mobilityActiveMapEngine === "wc" && typeof MapVxWcRuntime !== "undefined") {
      if (mobilityMapRouteActive || (MapVxWcRuntime.isRouteActive && MapVxWcRuntime.isRouteActive())) {
        MapVxWcRuntime.closeRoute();
        mobilityMapRouteActive = false;
      } else {
        const placeId = window.__mobilityLastWcPlaceId
          || (MapVxWcRuntime.getLastPlaceId && MapVxWcRuntime.getLastPlaceId())
          || "";
        if (!placeId) throw new Error("missing destination placeId");
        logMap("info", "wc route request", { placeId: placeId });
        await MapVxWcRuntime.showRoute(placeId, { timeoutMs: 18000 });
        mobilityMapRouteActive = !!(MapVxWcRuntime.isRouteActive && MapVxWcRuntime.isRouteActive());
        if (!mobilityMapRouteActive) throw new Error("wc route did not stay active");
      }
      btn.textContent = mobilityMapRouteActive ? t("clearRoute") : t("viewRoute");
      setMapStatus(placeIdLabelForRoute() + (mobilityMapRouteActive ? " · " + t("routeActive") : ""));
      return;
    }
    if (typeof MapVxBridge === "undefined" || !MapVxBridge.toggleRouteToTarget) return;
    const state = await MapVxBridge.toggleRouteToTarget();
    btn.textContent = state.active ? t("clearRoute") : t("viewRoute");
    const session = MapVxBridge.getMapSession && MapVxBridge.getMapSession();
    const title = session && session.result ? session.result.title : "";
    setMapStatus(title + (state.active ? " · " + t("routeActive") : ""));
  } catch (e) {
    mobilityMapRouteActive = false;
    logMap("error", "onMapRouteToggle failed", { message: e.message || String(e) });
    // WC route failed → reopen this store on the legacy bridge with navigation.
    if (mobilityActiveMapEngine === "wc"
      && preferredMobilityMapEngine() !== "wc"
      && window.__mobilityLastMapOpts) {
      try {
        setMapStatus(t("mapLoading") || "Cargando ruta…");
        await openPoiMapViaMapVx(Object.assign({}, window.__mobilityLastMapOpts, {
          mode: "navigation",
          local: window.__mobilityLastWcPlaceId || window.__mobilityLastMapOpts.local,
        }));
        mobilityMapRouteActive = true;
        btn.textContent = t("clearRoute");
        return;
      } catch (e2) {
        logMap("error", "route legacy fallback failed", { message: e2.message || String(e2) });
      }
    }
    setMapStatus(t("routeError") + ": " + (e.message || e));
    btn.textContent = t("viewRoute");
  }
}

function placeIdLabelForRoute() {
  if (typeof MapVxWcRuntime !== "undefined" && MapVxWcRuntime.getLastPlaceId) {
    return MapVxWcRuntime.getLastPlaceId() || "";
  }
  return "";
}

function setupMapControls(result) {
  updateMapRouteButton(result);
  const activeFloor = result && result.floorId ? result.floorId : null;
  renderMapFloorBar(activeFloor);
  const routeBtn = document.getElementById("map-route-btn");
  if (routeBtn && !routeBtn._bound) {
    routeBtn._bound = true;
    routeBtn.onclick = onMapRouteToggle;
  }
}

async function openPoiMapViaMapVx(opts) {
  const {
    poiType, id, floor, mall, name, local, mode,
    anchorLocal, poiRef, mapvxId, lat, lng, preferChangingTable, serviceId, serviceType,
    routeApproachQuery, routeApproachLocal, routeApproachWeight, routeApproachMaxMeters, routeApproachPullFrom,
    searchQueries,
  } = opts || {};
  const container = document.getElementById("mapvx-container");
  const iframe = document.getElementById("map-iframe");
  const wcStage = document.getElementById("mapvx-wc-stage");

  logMap("info", "openPoiMapViaMapVx start", opts);
  logMapVxConfig("openPoiMapViaMapVx");
  warmupMapVxInBackground();

  applyMapVxDefaultsFromMapPage();

  // Soft-hide WC (keep warm). Do not destroy — next store open should reuse it.
  if (typeof MapVxWcRuntime !== "undefined") {
    try {
      if (MapVxWcRuntime.hide) MapVxWcRuntime.hide();
      else if (MapVxWcRuntime.teardown) MapVxWcRuntime.teardown();
    } catch (e) { /* noop */ }
  }
  if (wcStage) {
    wcStage.classList.add("hidden");
    wcStage.classList.remove("preload-mount");
  }

  iframe.classList.add("hidden");
  iframe.src = "";
  setMapLoadingState(true);
  container.classList.remove("hidden");
  mobilityActiveMapEngine = "legacy";

  const mapAlreadyLive = typeof MapVxBridge.hasLiveMap === "function" && MapVxBridge.hasLiveMap();
  if (mapAlreadyLive && typeof MapVxBridge.notifyMapContainerShown === "function") {
    MapVxBridge.notifyMapContainerShown(container);
  }

  const preloadPromise = mapVxPreloadPromise;
  const mapReused = mapAlreadyLive || (preloadPromise ? await preloadPromise : false);
  if (!mapReused && typeof MapVxBridge !== "undefined" && MapVxBridge.destroyMap) {
    MapVxBridge.destroyMap();
    container.innerHTML = "";
  }
  resetMapControls();
  setMapStatus(t("mapLoading") || "Cargando mapa…");

  try {
    const isService = poiType === "service";
    let showFn;
    if (isService) {
      showFn = (mode === "navigation" && MapVxBridge.showServiceRouteTo)
        ? MapVxBridge.showServiceRouteTo
        : MapVxBridge.showServicePlace;
    } else {
      showFn = (mode === "navigation" && MapVxBridge.showRouteTo)
        ? MapVxBridge.showRouteTo
        : MapVxBridge.showPlace;
    }

    const bridgeOptions = isService
      ? {
          poiType: "service",
          serviceType: serviceType || "bathroom",
          serviceId: serviceId || id,
          id: serviceId || id,
          name,
          floor,
          mall,
          anchorLocal: anchorLocal || local,
          routeApproachQuery,
          routeApproachLocal,
          routeApproachWeight,
          routeApproachMaxMeters,
          routeApproachPullFrom,
          poiRef,
          mapvxId,
          lat,
          lng,
          searchQueries,
          preferChangingTable: !!preferChangingTable,
        }
      : {
          id,
          name,
          floor,
          local,
          mall,
          strictLocal: opts.strictLocal,
          poiType,
        };

    logMap("info", "calling MapVxBridge", { fn: showFn.name || "showPlace", isService });
    const result = await showFn(container, bridgeOptions);
    setMapStatus("");
    setupMapControls(result);
    setMapLoadingState(false);
    startMapZoomMeter();
    attachMapZoomLabelSwitcher(result);
    logMap("info", "openPoiMapViaMapVx success", Object.assign({ engine: "legacy" }, result));
    window.__mapVxLastLog = { ts: Date.now(), phase: "success", engine: "legacy", result: result };
    clearAutoMapLaunchUi();
    try { pushMobilityView('map'); } catch (e) {}
  } catch (e) {
    logMap("error", "openPoiMapViaMapVx failed", {
      message: e.message || String(e),
      attempts: e.attempts || null
    });
    window.__mapVxLastLog = {
      ts: Date.now(),
      phase: "error",
      message: e.message || String(e),
      attempts: e.attempts || null
    };
    clearAutoMapLaunchUi();
    container.classList.add("hidden");
    MapVxBridge.destroyMap();
    mapVxPreloadPromise = null;
    if (container) container.innerHTML = "";
    setMapLoadingState(false);
    stopMapZoomMeter();
    const placeholder = document.getElementById("map-placeholder");
    const attemptsHtml = e.attempts && e.attempts.length
      ? `<br><small>${escapeHtml(JSON.stringify(e.attempts))}</small>`
      : "";
    placeholder.innerHTML =
      `<div><strong>${escapeHtml(t("mapError") || "No se pudo cargar el mapa")}</strong><br><br>` +
      `${escapeHtml(name || "")}<br>` +
      `${escapeHtml(String(e.message || e))}` +
      attemptsHtml +
      `</div>`;
    placeholder.classList.remove("hidden");
    setMapStatus("");
  }
}

let mobilityActiveMapEngine = "none";
let mobilityWcReady = false;

function preferredMobilityMapEngine() {
  if (typeof MapVxWcRuntime !== "undefined" && MapVxWcRuntime.readMapEngine) {
    return MapVxWcRuntime.readMapEngine();
  }
  return "auto";
}

function initMobilityWcRuntime() {
  if (mobilityWcReady || typeof MapVxWcRuntime === "undefined") return mobilityWcReady;
  try {
    MapVxWcRuntime.init({
      placeMount: "#mapvx-wc-place",
      routeMount: "#mapvx-wc-route-mount",
      placeView: "#mapvx-wc-place-view",
      routeView: "#mapvx-wc-route-view",
      log: function (line) { logMap("info", String(line)); },
      onRouteClosed: function () {
        mobilityMapRouteActive = false;
        updateMapRouteButton({ routeActive: false });
      },
    });
    mobilityWcReady = true;
  } catch (error) {
    logMap("warn", "wc runtime init failed", { message: String(error && (error.message || error)) });
    mobilityWcReady = false;
  }
  return mobilityWcReady;
}

async function resolveStorePlaceIdForWc(opts) {
  const local = String((opts && opts.local) || "").trim();
  if (local && !/^\d+$/.test(local)) return local;
  const catalogId = String((opts && (opts.catalogId || opts.id)) || "").trim();
  try {
    if (typeof MarketSearch !== "undefined" && MarketSearch.loadCatalog) {
      await MarketSearch.loadCatalog();
      const hit = MarketSearch.findExact && MarketSearch.findExact({
        id: catalogId,
        local: local,
        name: opts && opts.name,
        floor: opts && opts.floor,
      });
      if (hit && hit.local) return String(hit.local).trim();
      if (hit && Array.isArray(hit.locations)) {
        for (let i = 0; i < hit.locations.length; i++) {
          if (hit.locations[i] && hit.locations[i].local) {
            return String(hit.locations[i].local).trim();
          }
        }
      }
    }
  } catch (error) {
    logMap("warn", "wc placeId resolve failed", { message: String(error && (error.message || error)) });
  }
  return local || "";
}

async function openPoiMapViaMapVxWc(opts) {
  const enginePref = preferredMobilityMapEngine();
  const placeId = await resolveStorePlaceIdForWc(opts);
  const cfg = (typeof MapVxWcRuntime !== "undefined" && MapVxWcRuntime.readConfig)
    ? MapVxWcRuntime.readConfig()
    : (window.MAPVX_CONFIG || {});
  const canTryWc = enginePref !== "legacy"
    && typeof MapVxWcRuntime !== "undefined"
    && MapVxWcRuntime.isAvailable
    && MapVxWcRuntime.isAvailable()
    && !!placeId
    && !!cfg.apiKey;

  if (!canTryWc) {
    if (enginePref === "wc") {
      throw new Error(placeId ? "MapVX Web Components no disponibles" : "Falta local MapVX routable");
    }
    return openPoiMapViaMapVx(opts);
  }

  const container = document.getElementById("mapvx-container");
  const iframe = document.getElementById("map-iframe");
  const wcStage = document.getElementById("mapvx-wc-stage");
  const placeholder = document.getElementById("map-placeholder");

  logMap("info", "openPoiMapViaMapVxWc start", { placeId: placeId, mode: opts && opts.mode });
  initMobilityWcRuntime();
  applyMapVxDefaultsFromMapPage();

  iframe.classList.add("hidden");
  iframe.src = "";
  if (placeholder) placeholder.classList.add("hidden");
  // Soft-hide legacy without destroying — services and WC fallback still need it warm.
  if (container) container.classList.add("hidden");
  if (wcStage) {
    wcStage.classList.remove("hidden");
    wcStage.classList.remove("preload-mount");
  }
  setMapLoadingState(true);
  setMapStatus(t("mapLoading") || "Cargando mapa…");
  resetMapControls();

  try {
    const wantsRoute = opts && opts.mode === "navigation";
    const cached = typeof MapVxWcRuntime.hasLiveMap === "function" && MapVxWcRuntime.hasLiveMap();
    window.__mobilityLastWcPlaceId = placeId;
    window.__mobilityLastMapOpts = Object.assign({}, opts, { local: placeId });
    if (wantsRoute && MapVxWcRuntime.hasRouteOrigin()) {
      await MapVxWcRuntime.showRoute(placeId, { timeoutMs: 18000 });
      mobilityMapRouteActive = true;
    } else {
      await MapVxWcRuntime.showPlace(placeId, { timeoutMs: cached ? 2500 : 6000 });
      mobilityMapRouteActive = false;
    }
    mobilityActiveMapEngine = "wc";
    setMapStatus("");
    setMapLoadingState(false);
    updateMapRouteButton({ routeActive: mobilityMapRouteActive });
    const floorBadge = document.getElementById("map-current-floor");
    if (floorBadge) floorBadge.classList.add("hidden");
    logMap("info", "openPoiMapViaMapVxWc success", { engine: "wc", placeId: placeId, cached: cached });
    window.__mapVxLastLog = { ts: Date.now(), phase: "success", engine: "wc", placeId: placeId, cached: cached };
    clearAutoMapLaunchUi();
    try { pushMobilityView("map"); } catch (e) {}
  } catch (error) {
    const message = String(error && (error.message || error));
    logMap("warn", "wc store map failed — fallback", { message: message, enginePref: enginePref });
    if (enginePref === "wc") {
      setMapLoadingState(false);
      if (wcStage) wcStage.classList.add("hidden");
      if (placeholder) {
        placeholder.innerHTML =
          `<div><strong>${escapeHtml(t("mapError") || "No se pudo cargar el mapa")}</strong><br><br>` +
          `${escapeHtml((opts && opts.name) || "")}<br>${escapeHtml(message)}</div>`;
        placeholder.classList.remove("hidden");
      }
      setMapStatus("");
      return;
    }
    if (typeof MapVxWcRuntime !== "undefined") {
      try {
        if (MapVxWcRuntime.hide) MapVxWcRuntime.hide();
        else if (MapVxWcRuntime.teardown) MapVxWcRuntime.teardown();
      } catch (e) { /* noop */ }
    }
    await openPoiMapViaMapVx(opts);
  }
}

let mobilityMapRouteActive = false;

function openPoiMapViaIframe({ poiType, id, floor, mall, name, local }) {
  logMap("warn", "openPoiMapViaIframe fallback (MapVX not configured or unavailable)", {
    poiType, id, floor, name
  });
  const iframe = document.getElementById("map-iframe");
  const container = document.getElementById("mapvx-container");
  const placeholder = document.getElementById("map-placeholder");
  const params = new URLSearchParams();
  if (mall) params.set("mall", mall);

  if (poiType === "service") {
    if (id) params.set("serviceId", id);
    if (name) params.set("serviceName", name);
  } else {
    if (id) params.set("storeId", id);
    if (floor) params.set("floor", floor);
    if (local) params.set("local", local);
    if (name) params.set("storeName", name);
  }
  if (floor) params.set("floor", floor);

  const mapUrl = MAP_SERVICE_BASE_URL || window.MALL_MAP_BASE_URL || "";
  container.classList.add("hidden");
  setMapLoadingState(false);
  if (mapUrl) {
    const fullUrl = mapUrl + (mapUrl.includes("?") ? "&" : "?") + params.toString();
    logMap("info", "iframe map URL", { url: fullUrl });
    iframe.src = fullUrl;
    iframe.classList.remove("hidden");
    placeholder.classList.add("hidden");
    setMapStatus("");
  } else {
    iframe.src = "";
    iframe.classList.add("hidden");
    placeholder.classList.remove("hidden");
    placeholder.innerHTML =
      `<div><strong>${escapeHtml(t("mapComingSoon"))}</strong><br><br>` +
      `${escapeHtml(name || "")}<br>` +
      `${floor ? `${escapeHtml(t("level"))}: ${escapeHtml(formatNivel(floor))}` : ""}</div>`;
    setMapStatus("");
  }
}

function storeMapKey(store) {
  if (!store) return "";
  const local = store.local != null ? String(store.local).trim() : "";
  const id = store.id != null ? String(store.id).trim() : "";
  return local || id;
}

function storeCatalogId(store) {
  if (!store) return "";
  const raw = String(store.catalogId || store.id || "").trim();
  return /^\d+$/.test(raw) ? raw : "";
}

function enrichStoreFromCatalogSync(store) {
  if (!store) return store;
  try {
    if (typeof MarketSearch === "undefined" || !MarketSearch.findExact) return store;
    // Prefer already-loaded catalog; loadCatalog is async and handled by enrichStoreDetailPanel.
    const hit = MarketSearch.findExact({
      id: storeCatalogId(store) || store.id,
      local: store.local,
      name: store.name || store.brand,
      floor: store.floor,
    });
    if (!hit) return store;
    if (typeof StoreDetail !== "undefined" && StoreDetail.merge) {
      return StoreDetail.merge(store, hit);
    }
    return mergeStoreDetail(store, hit);
  } catch (e) {
    return store;
  }
}

function openStoreMap(groupIndex, locationIndex) {
  let store = resolveStore(groupIndex, locationIndex);
  store = enrichStoreFromCatalogSync(store);
  const mapLocal = store && store.local != null ? String(store.local).trim() : "";
  const mapCatalogId = storeCatalogId(store);
  const mapKey = mapLocal || mapCatalogId;
  logMap("info", "openStoreMap", {
    groupIndex, locationIndex, mapLocal, mapCatalogId, mapKey,
    photos: store && store.market_photos ? store.market_photos.length : 0,
    schedules: store && store.schedules ? store.schedules.length : 0,
  });
  if (!store || store.available === false) {
    logMap("warn", "openStoreMap skipped", { reason: !store ? "no store" : "unavailable" });
    return;
  }
  if (!mapKey) {
    logMap("error", "openStoreMap aborted: no local/id on store", { name: store.name });
    return;
  }

  // Map uses `local` immediately — detail fetch must not block MapVX.
  openPoiMap({
    poiType: "store",
    id: mapCatalogId || mapLocal,
    catalogId: mapCatalogId,
    floor: store.floor,
    mall: store.mall,
    name: store.name || store.brand,
    local: mapLocal,
    mode: "place",
    storeDetail: store
  });
  enrichStoreDetailPanel(store);
}

function openPoiMap(opts) {
  const {
    poiType, id, floor, mall, name, local, catalogId, mode, storeDetail, serviceDetail,
    anchorLocal, poiRef, mapvxId, lat, lng, preferChangingTable, serviceId, serviceType,
    routeApproachQuery, routeApproachLocal, routeApproachWeight, routeApproachMaxMeters, routeApproachPullFrom,
    searchQueries,
  } = opts || {};

  const isService = poiType === "service";
  const mapLocal = (local != null && String(local).trim()) || "";
  const serviceKey = (serviceId != null && String(serviceId).trim())
    || (isService && id != null && String(id).trim())
    || "";
  const mapCatalogId = (catalogId != null && String(catalogId).trim())
    || (id != null && /^\d+$/.test(String(id).trim()) ? String(id).trim() : "");

  logMap("info", "openPoiMap called", {
    poiType, id, catalogId: mapCatalogId, floor, mall, name,
    local: mapLocal, serviceKey, serviceType, mode,
  });

  if (isService) {
    if (!serviceKey && !name) {
      logMap("error", "openPoiMap aborted: missing service id/name", { poiType });
      return;
    }
  } else if (!mapLocal && !mapCatalogId) {
    logMap("error", "openPoiMap aborted: missing local/id", { name, poiType });
    return;
  }

  const mapTitleText = document.getElementById("map-view-title-text");
  if (mapTitleText) {
    mapTitleText.textContent = poiType === "store"
      ? (t("mapStoreLocation") || "Ubicación de la tienda")
      : (poiType === "service" ? (t("mapServiceLocation") || "Ubicación del servicio") : (name || t("map") || "Mapa"));
  }
  document.querySelector(".cm-body").style.display = "none";
  document.querySelector(".cm-speak-fab").style.display = "none";
  document.getElementById("map-view").classList.remove("hidden");
  updateHeaderBackVisibility();

  if (poiType === "store" && storeDetail) {
    renderStoreDetailPanel(storeDetail);
    speakStoreDetail(storeDetail);
  } else if (isService && serviceDetail) {
    renderServiceDetailPanel(serviceDetail);
    speakStoreDetail(serviceDetail);
  } else {
    hideStoreDetailPanel();
    if (isService && name) {
      SimaBridge.speak(String(name));
    }
  }

  const mapOptions = isService
    ? {
        poiType,
        id: serviceKey,
        serviceId: serviceKey,
        serviceType: serviceType || "bathroom",
        floor,
        mall,
        name,
        anchorLocal,
        routeApproachQuery,
        routeApproachLocal,
        routeApproachWeight,
        routeApproachMaxMeters,
        routeApproachPullFrom,
        poiRef,
        mapvxId,
        lat,
        lng,
        searchQueries,
        preferChangingTable,
        mode,
      }
    : {
        poiType,
        id: mapCatalogId || mapLocal,
        catalogId: mapCatalogId,
        floor,
        mall,
        name,
        local: mapLocal,
        strictLocal: poiType === "store" && !!mapLocal,
        mode,
      };

  const doOpen = function() {
    if (poiType === "store") {
      openPoiMapViaMapVxWc(mapOptions);
      return;
    }
    if (useMapVxSdk()) {
      openPoiMapViaMapVx(mapOptions);
    } else {
      logMap("warn", "MapVX not ready after wait; iframe/placeholder fallback", mapOptions);
      openPoiMapViaIframe(mapOptions);
    }
  };

  waitForMapVxReady(doOpen);

  const eventType = poiType === "service" ? "service_map_opened" : "store_map_opened";
  SimaBridge.send(eventType, {
    id: isService ? serviceKey : mapLocal,
    text: name || "",
    destination: formatNivel(floor),
    anchorLocal: anchorLocal || "",
  });
}

window.pushNavigationFromUnity = function(data) {
  try {
    const payload = typeof data === "string" ? JSON.parse(data) : data;
    logMap("info", "pushNavigationFromUnity", payload);
    const cleanName = sanitizeStoreDisplayName(payload.name);
    const mapKey = payload.local || payload.placeId || payload.id;
    const catalogId = payload.catalogId || (payload.id && /^\d+$/.test(String(payload.id)) ? String(payload.id) : "");
    const storeDetail = findStoreInMarketPayload(mapKey) || {
      name: cleanName,
      floor: payload.floor,
      mall: payload.mall,
      local: mapKey,
      id: catalogId || payload.id
    };
    openPoiMap({
      poiType: "store",
      id: catalogId || mapKey,
      catalogId: catalogId || storeCatalogId(storeDetail),
      floor: payload.floor,
      mall: payload.mall,
      name: cleanName,
      local: mapKey,
      mode: "navigation",
      storeDetail: storeDetail
    });
  } catch (e) {
    logMap("error", "pushNavigationFromUnity failed", { message: e.message });
  }
};

function waitForMapVxReady(fn, attempt) {
  attempt = attempt || 0;
  try {
    if (typeof MapVxBridge !== "undefined" && MapVxBridge.isConfigured && MapVxBridge.isConfigured()) {
      fn();
      return;
    }
  } catch (e) { /* retry */ }
  if (attempt > 150) {
    logMap("error", "waitForMapVxReady timeout", {
      MapVxBridge: typeof MapVxBridge,
      MapVX: typeof MapVX,
      hasCfg: !!(window.MAPVX_CONFIG && window.MAPVX_CONFIG.apiKey)
    });
    try { fn(); } catch (e2) { logMap("error", "waitForMapVxReady fallback failed", { message: e2.message }); }
    return;
  }
  setTimeout(function () { waitForMapVxReady(fn, attempt + 1); }, 100);
}

function openServiceMap(idx, options) {
  options = options || {};
  const svc = lastServicesPayload?.results?.[idx];
  if (!svc) return;

  const normalized = normalizeServiceResult(svc);
  const floors = Array.isArray(normalized.floors) ? normalized.floors : [];
  const totemFloor = (typeof MapVxBridge !== "undefined"
    && MapVxBridge.configSummary
    && (MapVxBridge.configSummary().totemFloor || MapVxBridge.configSummary().floor))
    || (window.MAPVX_CONFIG && (window.MAPVX_CONFIG.totemFloor || window.MAPVX_CONFIG.floor))
    || "";
  const totemKey = typeof ServicesCatalog !== "undefined" && ServicesCatalog.normalizeFloorKey
    ? ServicesCatalog.normalizeFloorKey(totemFloor)
    : String(totemFloor || "").trim();
  const floorFromTotem = totemKey
    ? floors.find(function (f) {
        const key = ServicesCatalog.normalizeFloorKey
          ? ServicesCatalog.normalizeFloorKey(f)
          : String(f || "");
        return key && key === totemKey;
      })
    : "";
  // Prefer floor encoded in MapVX local (CC_N3_3208 → 3) over floors[0]=PB on multi-bank elevators.
  let floorFromAnchor = "";
  const localHint = String(normalized.anchorLocal || "").toUpperCase();
  const localFloorMatch = localHint.match(/_N(\d+)_/) || localHint.match(/_PB_/);
  if (localFloorMatch) {
    floorFromAnchor = localFloorMatch[1] != null ? localFloorMatch[1] : "PB";
  }
  const floor = floorFromTotem
    || floorFromAnchor
    || floors.find((f) => f && f !== "ALL" && String(f).toUpperCase() !== "PB")
    || floors.find((f) => f !== "ALL")
    || floors[0]
    || "";
  const canRoute = typeof MapVxBridge !== "undefined"
    && MapVxBridge.hasRouteOrigin
    && MapVxBridge.hasRouteOrigin();

  // Re-resolve floor-aware anchor for elevators (Ripley N5 → Burger King, etc.).
  let anchorLocal = normalized.anchorLocal;
  let routeApproachQuery = normalized.routeApproachQuery || "";
  let routeApproachLocal = normalized.routeApproachLocal || "";
  let routeApproachWeight = normalized.routeApproachWeight;
  let routeApproachMaxMeters = normalized.routeApproachMaxMeters;
  let routeApproachPullFrom = normalized.routeApproachPullFrom || "";
  if (normalized.type === "elevator" && typeof ServicesCatalog !== "undefined" && ServicesCatalog.getById) {
    const entry = ServicesCatalog.getById(normalized.id || normalized.catalogId);
    if (entry) {
      const card = ServicesCatalog.toResultCard(entry, {
        preferFloor: floor || totemKey || "",
        floor: floor || totemKey || "",
      });
      if (card.anchorLocal) anchorLocal = card.anchorLocal;
      if (card.routeApproachQuery) routeApproachQuery = card.routeApproachQuery;
      if (card.routeApproachLocal) routeApproachLocal = card.routeApproachLocal;
      if (card.routeApproachWeight != null) routeApproachWeight = card.routeApproachWeight;
      if (card.routeApproachMaxMeters != null) routeApproachMaxMeters = card.routeApproachMaxMeters;
      if (card.routeApproachPullFrom) routeApproachPullFrom = card.routeApproachPullFrom;
    }
  }

  openPoiMap({
    poiType: "service",
    serviceType: normalized.type || "bathroom",
    serviceId: normalized.id || normalized.catalogId,
    id: normalized.id || normalized.catalogId,
    floor: floor === "ALL" ? "" : floor,
    mall: normalized.mall || lastServicesPayload?.mall,
    name: normalized.name,
    anchorLocal: anchorLocal,
    routeApproachQuery: routeApproachQuery || undefined,
    routeApproachLocal: routeApproachLocal || undefined,
    routeApproachWeight: routeApproachWeight != null ? routeApproachWeight : undefined,
    routeApproachMaxMeters: routeApproachMaxMeters != null ? routeApproachMaxMeters : undefined,
    routeApproachPullFrom: routeApproachPullFrom || undefined,
    poiRef: normalized.poiRef,
    mapvxId: normalized.mapvxId,
    lat: normalized.mapvxLat,
    lng: normalized.mapvxLng,
    searchQueries: normalized.mapvxSearchQueries || undefined,
    preferChangingTable: !!(normalized.features && normalized.features.mudador),
    serviceDetail: normalized,
    mode: options.autoRoute ? "navigation" : "place",
  });
}

function closeMapView() {
  if (backToServiciosIfNeeded()) {
    window.location.href = "../servicios/index.html";
    return;
  }

  clearAutoMapLaunchUi();
  const container = document.getElementById("mapvx-container");
  const mapKept = typeof MapVxBridge !== "undefined"
    && MapVxBridge.suspendMap
    && MapVxBridge.hasLiveMap
    && MapVxBridge.hasLiveMap();

  // Park WC map warm instead of destroying it — next store open reuses mapReady.
  if (typeof MapVxWcRuntime !== "undefined") {
    try {
      if (MapVxWcRuntime.hide) MapVxWcRuntime.hide();
      else if (MapVxWcRuntime.teardown) MapVxWcRuntime.teardown();
    } catch (e) { /* noop */ }
  }

  if (typeof MapVxBridge !== "undefined") {
    if (MapVxBridge.suspendMap) {
      MapVxBridge.suspendMap();
    } else if (MapVxBridge.clearActiveRoute) {
      MapVxBridge.clearActiveRoute();
      MapVxBridge.destroyMap();
    }
  }
  if (!mapKept) {
    mapVxPreloadPromise = null;
    if (container) container.innerHTML = "";
  }
  stopMapZoomMeter();
  resetMapControls();
  hideStoreDetailPanel();
  mobilityActiveMapEngine = "none";
  mobilityMapRouteActive = false;
  document.getElementById("map-view").classList.add("hidden");
  document.getElementById("map-iframe").src = "";
  document.getElementById("map-iframe").classList.add("hidden");
  if (container) container.classList.add("hidden");
  document.getElementById("map-placeholder").classList.add("hidden");
  setMapLoadingState(false);
  setMapStatus("");
  document.querySelector(".cm-body").style.display = "";
  document.querySelector(".cm-speak-fab").style.display = "";
  updateHeaderBackVisibility();
  // pop map view from nav stack if present
  try {
    if (currentMobilityView() === 'map') popMobilityView();
  } catch (e) {}
}

function backToServiciosIfNeeded() {
  if (window.pendingServiceRouteSource === "servicios") return true;
  if (isCustomerServiceRouteFromServicios()) return true;
  try {
    const params = new URLSearchParams(window.location.search);
    return params.get("serviceId") === "customer-service-n1" && params.get("autoRoute") === "1";
  } catch (e) {
    return false;
  }
}

function startVoiceInput() {
  if (voiceListeningActive) {
    stopBrowserSpeechRecognition();
    setVoiceListeningState(false);
    SimaBridge.send("stop_stt", { screen: "mobility", source: "hablar_button" });
    return;
  }

  const payload = {
    screen: "mobility",
    mode: getMobilityMode() || "store_search",
    locale: mobilityLocale,
    host: (SimaBridge.isReactNativeHost && SimaBridge.isReactNativeHost()) ? "react-native" : "legacy",
    source: "hablar_button",
  };

  setVoiceListeningState(true, "voiceListening");
  SimaBridge.log(
    "start_stt mode=" + payload.mode +
    " locale=" + payload.locale +
    " host=" + payload.host
  );

  if (typeof SimaBridge.animate === "function") {
    SimaBridge.animate("listening");
  }

  const sent = (typeof SimaBridge.start_stt === "function")
    ? SimaBridge.start_stt(payload)
    : SimaBridge.send("start_stt", payload);

  if (sent) {
    scheduleVoiceListenTimeout();
    return;
  }

  if (isLocalHtmlMode() && tryBrowserSpeechRecognition()) {
    scheduleVoiceListenTimeout(30000);
    return;
  }

  setVoiceListeningState(false);
  SimaBridge.log("start_stt_unavailable channel=" + (SimaBridge.getLastSendChannel ? SimaBridge.getLastSendChannel() : "unknown"));
  showSearchError(t("voiceUnavailable"));
}

  try {
    var params = new URLSearchParams(window.location.search || "");
    var enabled = params.get("mapvxEmbed") === "1" || window.MAPVX_EMBED_ENABLED === true;
    if (!enabled) return;
    if (typeof window.MapvxEmbedHelper === "undefined" || !window.MapvxEmbedHelper.insertMapvxIframe) return;
    window.addEventListener("DOMContentLoaded", function () {

          document.body.appendChild(host);

        window.MapvxEmbedHelper.insertMapvxIframe({

          height: "1px",
          sandbox: "allow-scripts allow-same-origin"
        });
      } catch (e) {}
    });
  } catch (e) {}
})();
