<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promociones</title>
  <script>
    // Legacy entry used by the totem / OTA. Redirect immediately — no Mobility iframe.
    // location.replace() is synchronous and leaves NO history entry, so a later
    // host goBack() from Promociones skips this stub entirely (meta-refresh, which
    // some WebViews turn into a real history entry, is now noscript-only).
    (function () {
      var target = "promociones/";
      try {
        var q = window.location.search || "";
        var h = window.location.hash || "";
        window.location.replace(target + q + h);
      } catch (e) {
        window.location.href = target;
      }
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=promociones/" /></noscript>
</head>
<body>
  <p><a href="promociones/">Abrir promociones</a></p>
</body>
</html>
